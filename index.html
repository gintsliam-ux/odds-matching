  if (discOpen) renderErrorLog();
}

/* Both measures come off a single row now. `range` is the spread across the
   books quoting that selection; `prob` is how far a book's own vig-stripped
   fair sits from the blend of them all. */
function rowSpread(row) {
  const vals = Object.values(row.prices || {}).filter(v => v != null);
  if (vals.length < 2) return null;
  const min = Math.min(...vals), max = Math.max(...vals);
  const avg = (min + max) / 2;
  if (!avg) return null;
  return { mode: 'range', min, max, diff: max - min, pct: (max - min) / avg };
}
function rowFairGap(row) {
  const fairs = Object.values(row.fairs || {}).filter(v => v != null);
  if (!fairs.length || row.blend == null || !row.blend) return null;
  let worst = null;
  for (const f of fairs) {
    const pct = Math.abs(f - row.blend) / row.blend;
    if (!worst || pct > worst.pct) worst = { mode: 'prob', fair: f, blend: row.blend, diff: Math.abs(f - row.blend), pct };
  }
  return worst;
}

function findDiscrepancies(rows) {
  const out = [];
  for (const row of rows || []) {
    const r = discMode === 'prob' ? rowFairGap(row) : rowSpread(row);
    if (r && r.pct > discThreshold) {
      out.push({ market: row.market, selection: row.selection, line: row.line, ...r });
    }
  }
  return out;
}

function renderDiscTabs() {
  const modeEl = document.getElementById('disc-mode');
  const tabsEl = document.getElementById('disc-tabs');
  if (!modeEl || !tabsEl) return;
  modeEl.innerHTML = [
    { key: 'range', label: 'Book spread' },
    { key: 'prob', label: 'Fair vs blend' },
  ].map(m => `<button class="disc-mode-tab${m.key === discMode ? ' active' : ''}" onclick="setDiscMode('${m.key}')">${m.label}</button>`).join('');
  tabsEl.innerHTML = (DISC_THRESHOLDS[discMode] || []).map(t => {
    const pct = t * 100;
    const label = (pct < 1 ? pct.toFixed(1) : pct.toFixed(0)) + '%';
    return `<button class="disc-tab${t === discThreshold ? ' active' : ''}" onclick="setDiscThreshold(${t})">${label}</button>`;
  }).join('');
}
function setDiscMode(m) {
  discMode = m;
  if (!DISC_THRESHOLDS[m].includes(discThreshold)) discThreshold = DISC_THRESHOLDS[m][1];
  renderDiscTabs(); renderErrorLog();
}
function setDiscThreshold(t) { discThreshold = t; renderDiscTabs(); renderErrorLog(); }

function setDiscCount(n) {
  discCount = n == null ? 0 : n;
  const label = n == null ? '–' : String(n);
  const btn = document.getElementById('disc-btn-count');
  if (btn) { btn.textContent = label; btn.classList.toggle('zero', n == null || n === 0); }
  const head = document.getElementById('error-count');
  if (head) head.textContent = label;
}

/* Scoped to the open event. Scanning a whole month would mean an odds_sp query
   per fixture — the old schema carried every price in the rows the list already
   had, this one does not. */
function renderErrorLog() {
  const listEl = document.getElementById('error-log-list');
  const scopeEl = document.getElementById('disc-scope');
  if (!listEl) return;
  renderDiscTabs();

  if (activeSport && loadingKind) {
    listEl.innerHTML = skeletonDiscList();
    if (scopeEl) scopeEl.innerHTML = 'Scanning…';
    setDiscCount(null);
    return;
  }
  const ev = currentEvent();
  if (!ev || !detailRows.length) {
    listEl.innerHTML = `<div class="error-log-empty">Open an event to compare its books.</div>`;
    if (scopeEl) scopeEl.innerHTML = activeSport ? 'Nothing open' : '';
    setDiscCount(0);
    return;
  }

  const detail = (d) => d.mode === 'prob'
    ? `Fair <b>${d.fair.toFixed(2)}</b> vs blend <b>${d.blend.toFixed(2)}</b>`
    : `Range <b>${d.min.toFixed(2)} – ${d.max.toFixed(2)}</b>`;

  const sourceLabel = detailOddsSource === 'inplay' ? 'in-play prices'
    : detailOddsSource === 'pregame' ? 'pregame prices' : 'closing prices';
  if (scopeEl) scopeEl.innerHTML = `Within <b>${escHtml(ev.title)}</b> · ${escHtml(sourceLabel)}`;
  const discs = findDiscrepancies(detailRows).sort((a, b) => b.pct - a.pct);
  setDiscCount(discs.length);

  listEl.innerHTML = discs.length
    ? discs.map(d => `<div class="error-log-item" onclick="selectMarketType('${jsStr(d.market)}')">
        <div class="eli-detail">
          <span class="eli-market">${escHtml(formatMarketType(d.market))}${d.line != null ? ` ${d.line}` : ''}</span> · ${escHtml(d.selection)}<br>
          ${detail(d)} — <span class="eli-range">${(d.pct * 100).toFixed(1)}%</span>
        </div>
      </div>`).join('')
    : '<div class="error-log-empty">Nothing above the threshold for this event.</div>';
}

function renderHomeView() {
  setDetailMode(false);
  const view = document.getElementById('home-view');
  document.getElementById('match-list-view').style.display = 'none';
  const detail = document.getElementById('detail-view');
  detail.classList.remove('active');
  detail.innerHTML = '';

  const cutoff = recentCutoff();
  const tiles = Object.entries(SPORTS).map(([key, cfg]) => {
    const dr = sportData[key]?.dateRange;
    const hasData = !!(dr && dr.max);
    const calendar = inSeasonByCalendar(key);
    const veryRecent = hasData && dr.max >= cutoff;
    const isActive = calendar === null ? veryRecent : (calendar || veryRecent);
    return { key, cfg, dr, hasData, isActive, monthsCount: dr?.combos?.length ?? 0, sortKey: dr?.max || '' };
  }).sort((a, b) => {
    if (a.isActive !== b.isActive) return a.isActive ? -1 : 1;
    if (a.hasData !== b.hasData) return a.hasData ? -1 : 1;
    return b.sortKey.localeCompare(a.sortKey) || a.cfg.label.localeCompare(b.cfg.label);
  });

  const fmtMonth = (s) => s ? new Date(s + 'T00:00:00Z').toLocaleDateString('en-US', { month: 'short', year: 'numeric', timeZone: 'UTC' }) : '—';
  const tile = (t) => {
    if (!t.hasData) {
      return `<a class="home-tile ${t.isActive ? '' : 'off'}" href="#/${t.key}">
        <div class="ht-head">${sportIconHtml(t.key, 'ht-icon')}<div class="ht-name">${escHtml(t.cfg.label)}</div>${bar('58px', 17, '999px')}</div>
        ${bar('136px', 16)}
        <div class="ht-foot">${bar('82px', 12)}${bar('66px', 12)}</div>
      </a>`;
    }
    const status = t.isActive ? { cls: 'active', text: 'Active' } : { cls: 'off', text: 'Off-season' };
    return `<a class="home-tile ${t.isActive ? '' : 'off'}" href="#/${t.key}">
      <div class="ht-head">
        ${sportIconHtml(t.key, 'ht-icon')}
        <div class="ht-name">${escHtml(t.cfg.label)}</div>
        <span class="ht-status ${status.cls}">${status.text}</span>
      </div>
      <div class="ht-range">${fmtMonth(t.dr?.min)} → ${fmtMonth(t.dr?.max)}</div>
      <div class="ht-foot">
        ${seasonLabel(t.key) ? `<span class="ht-season">${escHtml(seasonLabel(t.key))}</span>` : ''}
        ${t.monthsCount ? `<span class="ht-months">${t.monthsCount} mo of data</span>` : ''}
      </div>
    </a>`;
  };

  const on = tiles.filter(t => t.isActive), off = tiles.filter(t => !t.isActive);
  let html = `<div class="home-hero">
      <h2><b>Odds</b> Library</h2>
      <p>Closing prices, vig-stripped fair values and cross-book spreads for every fixture we capture.

    </div>`;
  if (on.length) html += `<div class="home-section-title">In season</div><div class="home-grid">${on.map(tile).join('')}</div>`;
  if (off.length) html += `<div class="home-section-title">Off-season / archive</div><div class="home-grid">${off.map(tile).join('')}</div>`;

/* ===========================================================================
   Match list
   =========================================================================== */
function renderMatchList() {
  const data = sportData[activeSport];
  const listEl = document.getElementById('match-list-view');
  if (!data) return;

  const events = data.events || [];
  const leagues = data.monthLeagues || [];
  const needsPick = !selectedTournament && (data.monthFixtures || 0) > MONTH_FIXTURE_BUDGET && !data.loadedScope;

  let html = `<div class="list-head">
      <h2>${escHtml(currentTournamentLabel() || SPORTS[activeSport].label)}</h2>
      <div class="lh-sub"><b>${events.length}</b> event${events.length === 1 ? '' : 's'}${periodLabel() ? ' · ' + escHtml(periodLabel()) : ''}</div>
    </div>`;

  if (needsPick) {
    html += renderTournamentPicker(leagues);
  } else if (!events.length) {
    html += `<div class="empty-state">
        <div class="es-title">Nothing to show for ${escHtml(periodLabel())}</div>
        <div class="es-sub">No ${escHtml(currentTournamentLabel() || SPORTS[activeSport].label)} fixtures in this period. Try another month.</div>
      </div>`;
    if (leagues.length) html += renderTournamentPicker(leagues);
  } else {
    const perDay = new Map();
    for (const ev of events) {
      const k = dayKey(ev.start);
      if (!perDay.has(k)) perDay.set(k, []);
      perDay.get(k).push(ev);

/* ===========================================================================
   Odds table
   ---------------------------------------------------------------------------
   Rows arrive one per selection. Group them by line so a handicap's -0.5 and
   its +0.5 sit together, and build the book columns from the jsonb keys that
   actually appear — a book the feed adds tomorrow needs nothing here.
   =========================================================================== */
// A handicap's two sides share a group, so the sign belongs on the selection.
function selectionLabel(row) {
  const m = String(row.market || '').toLowerCase();
  const signed = row.line != null && (m.includes('spread'));
  if (!signed) return escHtml(row.selection);
  return `<span class="oc-name">${escHtml(row.selection)}</span> <span class="oc-line">${row.line > 0 ? '+' : ''}${row.line}</span>`;
}

function lineLabel(row) {
  const m = String(row.market || '').toLowerCase();
  /* A market with no line still needs a word in the line column, and the market
     is the only true thing to put there — "Match Winner", not "H2H", so it
     reads the same as the tab above it. */
  if (row.lineGroup == null && row.line == null) return formatMarketType(m) || 'Match Winner';
  const g = row.lineGroup != null ? row.lineGroup : Math.abs(row.line);
  if (m.includes('total') || m === 'total_sets') return `O/U ${g}`;
  return `Line ${g}`;   // the sign lives on each selection, not on the group
}

function renderOddsTable(rows) {
  if (!rows.length) return '<div class="empty-state"><div class="es-title">No prices in this market</div></div>';

  // Group by line, keeping the order the lines came in (already sorted by key).
  const groups = new Map();
  for (const r of rows) {
    const k = r.lineGroup == null ? 'null' : String(r.lineGroup);
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(r);
  }
  /* Within a group, outcome_no restores the old oc1/oc2/oc3 reading order:
     1 home/Over/Yes, 2 away/Under/No, 3 Draw. */
  for (const g of groups.values()) {
    g.sort((a, b) => (a.outcomeNo ?? 99) - (b.outcomeNo ?? 99) || String(a.selection).localeCompare(String(b.selection)));
  }
  /* Order by how real a line is, not by its number. A book like Betfair quotes
     an entire ladder — an AFL spread ran from -99.5 up, every one a single book
     at 1.01 — so pure line order buries the market under a hundred rows nobody
     wants. `is_main` marks exactly one line per book per market, so those lead,
     then the most widely quoted, and only then the line itself. */
  const groupRank = (rows) => {
    const main = rows.some(r => r.main) ? 1 : 0;
    const books = Math.max(...rows.map(r => Object.keys(r.prices || {}).length));
    return [main, books];
  };
  const ordered = [...groups.entries()].sort((a, b) => {
    const [ma, ba] = groupRank(a[1]), [mb, bb] = groupRank(b[1]);
    if (ma !== mb) return mb - ma;
    if (ba !== bb) return bb - ba;
    const la = a[1][0].lineGroup, lb = b[1][0].lineGroup;
    if (la == null && lb == null) return 0;
    if (la == null) return -1;
    if (lb == null) return 1;
    return la - lb;
  });

  const books = sortBooks([...new Set(rows.flatMap(r => Object.keys(r.prices || {})))]);
  const fairBooks = sortBooks([...new Set(rows.flatMap(r => Object.keys(r.fairs || {})))]);
  const any = (fn) => rows.some(fn);

  const cols = [
    { key: 'line', label: 'Line', type: 'text' },
    { key: 'selection', label: 'Selection', type: 'text' },
  ];
  for (const b of books) cols.push({ key: 'p_' + b, label: bookLabel(b), sortable: true, type: 'num', html: bookHeader(b, false) });
  for (const b of fairBooks) cols.push({ key: 'f_' + b, label: bookLabel(b) + ' Fair', sortable: true, type: 'num', html: bookHeader(b, true) });
  if (any(r => r.blend != null)) cols.push({ key: 'blend', label: 'Fair Blend', sortable: true, type: 'num' });
  if (any(r => r.prob != null)) cols.push({ key: 'prob', label: 'Fair %', sortable: true, type: 'num' });
  // Only the archive era carries these — about a fifth of odds_sp — so they
  // appear on the fixtures that have them rather than as empty columns.
  if (any(r => r.ogBlend != null)) cols.push({ key: 'ogBlend', label: 'Orig Blend', sortable: true, type: 'num' });
  if (any(r => r.ogProb != null)) cols.push({ key: 'ogProb', label: 'Orig %', sortable: true, type: 'num' });
  cols.push({ key: 'spread', label: 'Book Spread', sortable: true, type: 'num' });
  if (any(r => r.nBooks)) cols.push({ key: 'nBooks', label: 'Books', sortable: true, type: 'num' });
  if (any(r => r.tier && r.tier !== 'core')) cols.push({ key: 'tier', label: 'Tier', type: 'text' });

  const tableId = 'tbl-' + Math.random().toString(36).slice(2, 8);
  let html = `<div class="table-wrapper"><table class="odds-table" id="${tableId}"><thead><tr>`;
  for (const c of cols) {
    html += `<th data-col="${c.key}" title="${escAttr(c.label)}"${c.sortable ? ` onclick="sortTable('${tableId}','${c.key}','${c.type}')"` : ''}>${c.html || escHtml(c.label)}${c.sortable ? '<span class="sort-arrow"></span>' : ''}</th>`;
  }
  html += '</tr></thead><tbody>';

  let g = 0;
  for (const [, groupRows] of ordered) {
    for (let i = 0; i < groupRows.length; i++) {
      const r = groupRows[i];
      const spread = rowSpread(r);
      const prices = Object.values(r.prices || {}).filter(v => v != null);
      const best = prices.length ? Math.max(...prices) : null;
      const worst = prices.length ? Math.min(...prices) : null;
      html += `<tr class="${i === groupRows.length - 1 ? 'group-row' : ''}" data-sort-group="${g}">`;

      for (const col of cols) {
        if (col.key === 'line') {
          if (i === 0) html += `<td class="question-cell" rowspan="${groupRows.length}">${escHtml(lineLabel(r))}</td>`;
          continue;
        }
        if (col.key === 'selection') {
          html += `<td class="outcome-cell" title="${escAttr(r.selection)}">${selectionLabel(r)}</td>`;
          continue;
        }
        if (col.key === 'tier') {
          html += `<td class="${r.tier === 'core' ? 'odds-val' : 'null-val'}">${escHtml(r.tier || '—')}</td>`;
          continue;
        }
        if (col.key === 'spread') {
          if (!spread) { html += '<td class="null-val" data-val="">—</td>'; continue; }
          const cls = spread.pct > discThreshold ? 'highlight-red' : 'odds-val';
          html += `<td class="${cls}" data-val="${spread.pct}">${spread.min.toFixed(2)}–${spread.max.toFixed(2)}</td>`;
          continue;
        }
        if (col.key === 'nBooks') {
          html += `<td class="odds-val" data-val="${r.nBooks || 0}">${r.nBooks || '—'}</td>`;
          continue;
        }
        if (col.key === 'prob' || col.key === 'ogProb') {
          const v = col.key === 'prob' ? r.prob : r.ogProb;
          html += v == null ? '<td class="null-val" data-val="">—</td>'
            : `<td class="prob-cell" data-val="${v}">${v.toFixed(1)}%</td>`;
          continue;
        }
        if (col.key === 'blend' || col.key === 'ogBlend') {
          const v = col.key === 'blend' ? r.blend : r.ogBlend;
          html += v == null ? '<td class="null-val" data-val="">—</td>'
            : `<td class="odds-val" data-val="${v}">${v.toFixed(2)}</td>`;
          continue;
        }
        const isFair = col.key.startsWith('f_');
        const book = col.key.slice(2);
        const val = isFair ? (r.fairs || {})[book] : (r.prices || {})[book];
        if (val == null) { html += '<td class="null-val" data-val="">—</td>'; continue; }
        // Mark the best available price across books for this selection.
        const cls = (!isFair && best != null && best !== worst && val === best) ? 'odds-val best-odds' : 'odds-val';
        html += `<td class="${cls}" data-val="${val}">${val.toFixed(2)}</td>`;
      }
      html += '</tr>';
    }
    g++;
  }
  return html + '</tbody></table></div>';
}

const BOOK_LOGO_FILES = new Set(['pinnacle', 'bet365', 'sportsbet', 'tab', 'ladbrokes', 'fanduel',
  'fanatics', 'betfair', 'draftkings']);
function bookHeader(key, isFair) {
  const meta = BOOK_META[key] || {};
  const file = meta.logo;
  const tag = meta.tag ? `<span class="bk-fair">${escHtml(meta.tag)}</span>` : '';
  const label = [bookLabel(key), meta.tag, isFair ? 'Fair' : null].filter(Boolean).join(' ');
  const fair = isFair ? '<span class="bk-fair">Fair</span>' : '';
  if (!file || !BOOK_LOGO_FILES.has(file)) {
    return `<span class="bk"><span class="bk-name">${escHtml(bookLabel(key))}</span>${tag}${fair}</span>`;
  }
  return `<span class="bk">
      <img class="bk-logo" src="assets/books/${file}.png" alt="${escAttr(label)}"
           onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'bk-name',textContent:'${jsStr(bookLabel(key))}'}))">
      ${tag}${fair}
    </span>`;
}

/* ---- Sorting --------------------------------------------------------------- */
const sortState = {};
function sortTable(tableId, colKey, colType) {
  const table = document.getElementById(tableId);
  if (!table) return;
  const tbody = table.querySelector('tbody');
  const rows = Array.from(tbody.querySelectorAll('tr'));

  const groups = [];
  let cur = null, curKey = null;
  for (const row of rows) {
    const k = row.dataset.sortGroup;
    if (k !== curKey) { cur = []; groups.push(cur); curKey = k; }
    cur.push(row);
  }
  const prev = sortState[tableId];
  const dir = prev && prev.col === colKey && prev.dir === 'asc' ? 'desc' : 'asc';
  sortState[tableId] = { col: colKey, dir };

  const ths = Array.from(table.querySelectorAll('thead th'));
  const colIdx = ths.findIndex(th => th.dataset.col === colKey);
  if (colIdx === -1) return;
  ths.forEach(th => { const a = th.querySelector('.sort-arrow'); if (a) a.textContent = ''; });
  const arrow = ths[colIdx].querySelector('.sort-arrow');
  if (arrow) arrow.textContent = dir === 'asc' ? ' ▲' : ' ▼';

  groups.sort((a, b) => {
    const va = getSortVal(a[0], colIdx, colType), vb = getSortVal(b[0], colIdx, colType);
    if (va == null && vb == null) return 0;
    if (va == null) return 1;
    if (vb == null) return -1;
    if (colType === 'num') return dir === 'asc' ? va - vb : vb - va;
    return dir === 'asc' ? String(va).localeCompare(String(vb)) : String(vb).localeCompare(String(va));
  });
  for (const g of groups) for (const row of g) tbody.appendChild(row);
}
function getSortVal(row, colIdx, colType) {
  const cell = row.querySelectorAll('td')[colIdx];
  if (!cell) return null;
  if (colType === 'num') {
    const dv = cell.dataset.val;
    if (dv !== undefined && dv !== '') return parseFloat(dv);
    const num = parseFloat(cell.textContent.replace('%', '').trim());
    return isNaN(num) ? null : num;
  }
  return cell.textContent.trim();
}

/* ===========================================================================
   Routing  —  #/{sport}/{league}/{fixture_id}
   =========================================================================== */
function currentTournamentSlug() { return selectedTournament || null; }

function goHome() {
  if (location.hash === '' || location.hash === '#' || location.hash === '#/') handleRoute();
  else location.hash = '#/';
}
function navigate(sport, slug, tournament) {
  if (tournament === undefined) tournament = currentTournamentSlug();
  let hash = `#/${sport}`;
  if (tournament) hash += `/${tournament}`;
  if (slug) hash += `/${slug}`;
  if (location.hash !== hash) location.hash = hash;
  else handleRoute();
}

/* A fixture_id is a 16-char hex Optic id or syn_<hash>; a league id always
   starts with its sport. That tells the two apart without a lookup. */
function looksLikeFixtureId(s) {
  return /^syn_[0-9a-f]+$/i.test(s) || /^[0-9A-F]{12,20}$/i.test(s);
}
function parseRoute() {
  const parts = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
  const sport = SPORTS[parts[0]] ? parts[0] : null;
  let tournament = null, slug = null;
  if (sport && parts[1]) {
    if (looksLikeFixtureId(parts[1])) slug = parts[1];
    else { tournament = parts[1]; slug = parts[2] || null; }
  }
  return { sport, tournament, slug };
}

async function loadScoped(key) {
  const d = sportData[key] || {};
  if (!selectedTournament && (d.monthFixtures || 0) > MONTH_FIXTURE_BUDGET) {
    d.events = []; d.loadedScope = null;
    return d;
  }
  return loadFixtures(key, selectedYear, selectedMonth, selectedTournament);
}

/* Open on the month we are in, not the last month holding a fixture: several
   sports carry events scheduled a year out. Falls back to the nearest month. */
function defaultPeriod(combos) {
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth() + 1;
  const exact = combos.find(c => c.year === y && c.month === m);
  if (exact) return exact;
  const target = y * 12 + m;
  return combos.reduce((best, c) =>
    Math.abs(c.year * 12 + c.month - target) < Math.abs(best.year * 12 + best.month - target) ? c : best, combos[0]);
}

let _routing = false, _routeQueued = false;
async function handleRoute() {
  if (_routing) { _routeQueued = true; return; }
  _routing = true;
  try {
    const { sport, tournament, slug } = parseRoute();

    if (!sport) {
      activeSport = null; currentSlug = null; selectedTournament = null;
      selectedYear = null; selectedMonth = null; detailRows = [];
      document.getElementById('loading').style.display = 'none';
      renderHomeView(); renderSidebar(); renderTopbar(); toggleDisc(false);
      document.title = 'Odds Library';
      const missing = Object.keys(SPORTS).filter(k => !sportData[k]?.dateRange);
      if (missing.length) {
        Promise.allSettled(missing.map(k => loadDateRange(k))).then(() => {
          if (!parseRoute().sport) { renderHomeView(); renderSidebar(); }
        });
      }
      return;
    }

    document.getElementById('home-view').style.display = 'none';
    if (sport !== activeSport) {
      currentSlug = null; selectedTournament = null; navFilter = '';
      selectedYear = null; selectedMonth = null; activeMarketType = null; detailRows = [];
      const dv = document.getElementById('detail-view');
      dv.classList.remove('active'); dv.innerHTML = '';
    }
    activeSport = sport;

    showLoading(slug ? 'detail' : 'list');
    try {
      const range = sportData[sport]?.dateRange || await loadDateRange(sport);
      if (!range.combos.length) {
        showLoading(null);
        document.getElementById('match-list-view').innerHTML =
          `<div class="notice">No fixtures captured for ${escHtml(SPORTS[sport].label)} yet.</div>`;
        document.getElementById('match-list-view').style.display = '';
        renderSidebar(); renderTopbar();
        return;
      }
      if (!selectedYear || !selectedMonth) {
        const start = defaultPeriod(range.combos);
        selectedYear = start.year; selectedMonth = start.month;
      }
      await loadMonthLeagues(sport, selectedYear, selectedMonth);
      selectedTournament = tournament || null;
      renderSidebar();
      if (!slug && !selectedTournament && (sportData[sport].monthFixtures || 0) > MONTH_FIXTURE_BUDGET) {
        showLoading('picker');
      }
      await loadScoped(sport);

      /* A deep link can name a fixture from another month. The id carries no
         date, so ask fixtures where it is and reload that period. */
      if (slug && !(sportData[sport].events || []).some(e => e.id === slug)) {
        const found = await sb('fixtures', `select=scheduled_start,optic_league&fixture_id=eq.${encodeURIComponent(slug)}&limit=1`);
        if (found.length) {
          const d = new Date(found[0].scheduled_start);
          selectedYear = d.getUTCFullYear(); selectedMonth = d.getUTCMonth() + 1;
          if (!selectedTournament && found[0].optic_league) selectedTournament = entryIdFor(found[0].optic_league, null);
          await loadMonthLeagues(sport, selectedYear, selectedMonth);
          await loadScoped(sport);
        }
      }
    } catch (err) {
      showLoading(null);
      document.getElementById('match-list-view').innerHTML =
        `<div class="notice" style="color:var(--neg)">Error loading ${escHtml(SPORTS[sport].label)}: ${escHtml(err.message)}</div>`;
      document.getElementById('match-list-view').style.display = '';
      console.error(err);
      renderSidebar(); renderTopbar();
      return;
    }
    showLoading(null);

    if (!slug) {
      currentSlug = null; detailRows = [];
      const dv = document.getElementById('detail-view');
      dv.classList.remove('active'); dv.innerHTML = '';
      document.getElementById('match-list-view').style.display = '';
      setDetailMode(false);
    }

    renderSidebar();
    renderMatchList();
    loadLeagues(sport);          // non-blocking: fills in the sport's full history

    if (slug) await openDetailDirect(slug);
    renderTopbar();

    const ev = currentEvent();
    document.title = ev ? `${ev.title} · Odds Library`
      : `${currentTournamentLabel() || SPORTS[sport].label} · Odds Library`;
  } finally {
    _routing = false;
    if (_routeQueued) { _routeQueued = false; handleRoute(); }
  }
}

window.addEventListener('hashchange', handleRoute);
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  if (discOpen) toggleDisc(false);
  else toggleSidebar(false);
});

/* ===========================================================================
   Loading states — a skeleton is the shape of the thing arriving
   =========================================================================== */
function bar(w, h, r) {
  return `<div class="skeleton skel-bar" style="width:${w};height:${h}px${r ? `;border-radius:${r}` : ''}"></div>`;
}
function vary(i, lo, hi) { return lo + ((i * 37) % (hi - lo + 1)); }

let loadingKind = null;

function showLoading(kind) {
  const el = document.getElementById('loading');
  loadingKind = kind || null;
  if (!kind) { el.style.display = 'none'; el.innerHTML = ''; return; }
  setDetailMode(false);
  el.style.display = '';
  el.innerHTML = kind === 'detail' ? skeletonDetail() : kind === 'picker' ? skeletonPicker() : skeletonMatchList();
  document.getElementById('match-list-view').style.display = 'none';
  document.getElementById('detail-view').classList.remove('active');
  renderErrorLog();
}

function skeletonMatchList() {
  const card = (i) => `<div class="skel-card">
      <div class="skel-row">${bar(vary(i, 46, 78) + 'px', 10)}<div style="flex:1"></div>${bar('58px', 16, '999px')}</div>
      ${bar(vary(i, 62, 88) + '%', 15)}
      <div class="skel-row">${bar('54px', 13)}</div>
    </div>`;
  const group = (n, from) => `<div class="day-head">${bar('124px', 11)}</div>
    <div class="match-grid">${Array.from({ length: n }, (_, i) => card(from + i)).join('')}</div>`;
  return `<div class="list-head">${bar('190px', 22)}<div style="flex:1"></div>${bar('130px', 13)}</div>
    <div class="load-msg" id="load-msg">Loading…</div>${group(4, 0)}${group(3, 4)}`;
}

function skeletonDetail() {
  const COLS = [150, 120, 70, 70, 70, 70, 70, 70, 60, 60];
  const head = `<div class="skel-thead">${COLS.map(w => bar(w + 'px', 10)).join('')}</div>`;
  const row = (i) => `<div class="skel-trow">${COLS.map((w, c) => bar((c < 2 ? vary(i + c, 60, 100) * w / 100 : w) + 'px', 12)).join('')}</div>`;
  return `<div class="detail-top">${bar('84px', 32, '10px')}</div>
    <div class="skel-detail-header">
      <div class="sdh-main">
        <div class="skel-row" style="display:flex;gap:8px;align-items:center">${bar('18px', 18, '5px')}${bar('130px', 10)}</div>
        ${bar('340px', 26)}
        <div class="sdh-meta">${bar('150px', 12)}${bar('58px', 12)}${bar('90px', 12)}</div>
      </div>
      ${bar('72px', 40, '8px')}
    </div>
    <div class="load-msg" id="load-msg">Loading…</div>
    <div class="skel-mkt-tabs">${[92, 78, 62, 104, 96].map(w => bar(w + 'px', 15)).join('')}</div>
    <div class="skel-table-wrap">${head}${Array.from({ length: 10 }, (_, i) => row(i)).join('')}</div>`;
}

function skeletonPicker() {
  const item = (i) => `<div class="tp-item">${bar(vary(i, 55, 90) + '%', 13)}<div style="flex:1"></div>${bar('34px', 11)}</div>`;
  return `<div class="list-head">${bar('190px', 22)}<div style="flex:1"></div>${bar('130px', 13)}</div>
    <div class="load-msg" id="load-msg">Loading…</div>
    <div class="tp-wrap">
      <div class="tp-head">${bar('170px', 15)}<div style="height:6px"></div>${bar('420px', 12)}</div>
      <div class="tp-grid">${Array.from({ length: 12 }, (_, i) => item(i)).join('')}</div>
    </div>`;
}
function skeletonTournaments(n = 7) {
  return `<div class="sb-tourns">${Array.from({ length: n }, (_, i) =>
    `<div class="skel-tourn">${bar(vary(i, 45, 92) + '%', 11)}</div>`).join('')}</div>`;
}
function skeletonDiscList(n = 5) {
  return Array.from({ length: n }, (_, i) => `<div class="error-log-item" style="cursor:default">
      ${bar(vary(i, 52, 86) + '%', 12)}<div style="height:6px"></div>
      ${bar(vary(i + 3, 60, 94) + '%', 10)}<div style="height:5px"></div>
      ${bar(vary(i + 1, 40, 70) + '%', 10)}
    </div>`).join('');
}
function skeletonSearch(n = 4) {
  return Array.from({ length: n }, (_, i) => `<div class="search-result-item" style="cursor:default">
      ${bar(vary(i, 55, 92) + '%', 12)}<div style="height:5px"></div>${bar(vary(i + 2, 40, 75) + '%', 9)}
    </div>`).join('');
}

/* ===========================================================================
   Init
   =========================================================================== */
async function init() {
  initSidebarCollapsed();
  renderSidebar();
  await Promise.all([loadCompetitionLogos(), loadLeagueDirectory()]);
  await handleRoute();
  const missing = Object.keys(SPORTS).filter(k => !sportData[k]?.dateRange);
  if (missing.length) {
    Promise.allSettled(missing.map(k => loadDateRange(k))).then(() => {
      renderSidebar();
      if (!parseRoute().sport) renderHomeView();
    });
  }
}

init().catch(err => {
  document.getElementById('loading').innerHTML = `<div class="notice" style="color:var(--neg)">Error: ${escHtml(err.message)}</div>`;
  document.getElementById('loading').style.display = '';
  console.error(err);
});
</script>
