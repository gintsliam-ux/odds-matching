/* ===========================================================================
   Topbar
   =========================================================================== */
function renderTopbar() { renderCrumbs(); renderTopbarActions(); }

function currentEvent() {
  if (!currentSlug || !activeSport) return null;
  return (sportData[activeSport]?.events || []).find(e => e.slug === currentSlug) || null;
}

function renderCrumbs() {
  const el = document.getElementById('crumbs');
  if (!el) return;
  const parts = [];
  if (!activeSport) {
    parts.push({ label: 'All sports', current: true });
  } else {
    const ev = currentEvent();
    parts.push({ label: 'All sports', go: 'goHome()' });
    parts.push({ label: SPORTS[activeSport].label, go: `switchSport('${activeSport}')`, current: !selectedTournament && !ev });
    if (selectedTournament) {
      parts.push({ label: currentTournamentLabel() || selectedTournament,
                   go: `selectTournament('${jsStr(selectedTournament)}')`, current: !ev });
    }
    if (ev) parts.push({ label: ev.title, current: true });
  }
  el.innerHTML = parts.map((p, i) =>
    (i ? '<span class="crumb-sep">/</span>' : '') +
    `<span class="crumb ${p.current ? 'current' : ''}"${p.current ? '' : ` onclick="${p.go}"`}>${escHtml(p.label)}</span>`
  ).join('');
}

function renderPeriodPicker() {
  const combos = sportData[activeSport]?.dateRange?.combos;
  if (!combos || !combos.length) return '';
  const years = [...new Set(combos.map(c => c.year))].sort((a, b) => b - a);
  const months = combos.filter(c => c.year === selectedYear).map(c => c.month);
  return `<div class="period" title="Period shown">
      <select onchange="setDateFilter(parseInt(this.value), null)">
        ${years.map(y => `<option value="${y}" ${y === selectedYear ? 'selected' : ''}>${y}</option>`).join('')}
      </select>
      <div class="period-div"></div>
      <select onchange="setDateFilter(selectedYear, parseInt(this.value))">
        ${months.map(m => `<option value="${m}" ${m === selectedMonth ? 'selected' : ''}>${MONTH_LONG[m]}</option>`).join('')}
      </select>
    </div>`;
}

function renderTopbarActions() {
  const el = document.getElementById('topbar-actions');
  if (!el) return;
  if (!activeSport) { el.innerHTML = ''; return; }
  let html = renderPeriodPicker();
  if (currentSlug) {
    html += `<button class="btn" id="refresh-btn" onclick="refreshDetail()" title="Reload this event">${ICON.refresh}<span id="refresh-label">Refresh</span></button>`;
  }
  html += `<button class="btn" onclick="toggleDisc()" title="Show discrepancies">
      ${ICON.warn}<span class="btn-lbl">Discrepancies</span>
      <span class="btn-count ${discCount ? '' : 'zero'}" id="disc-btn-count">${discCount}</span>
    </button>`;
  el.innerHTML = html;
}

async function setDateFilter(year, month) {
  const combos = sportData[activeSport]?.dateRange?.combos;
  if (!combos) return;
  selectedYear = year;
  const monthsForYear = combos.filter(c => c.year === year).map(c => c.month);
  selectedMonth = (!month || !monthsForYear.includes(month)) ? monthsForYear[monthsForYear.length - 1] : month;

  // An open event belongs to the old period — changing month always lands on the list.
  currentSlug = null;
  activeMarketType = null;
  const dv = document.getElementById('detail-view');
  dv.classList.remove('active');
  dv.innerHTML = '';

  showLoading('list');
  try {
    await loadTournamentIndex(activeSport, selectedYear, selectedMonth);
    // The tournament we were on may not run in the new month.
    // Keep the tournament if it still exists for this sport at all — it may
    // simply have no fixtures this month, which the empty state explains.
    if (selectedTournament && !tournamentEntry(activeSport, selectedTournament)) selectedTournament = null;
    await loadScoped(activeSport);
  } catch (err) {
    console.error(err);
  }
  showLoading(null);

  // Keep the URL honest: drop the event slug, keep the tournament if it survived.
  const tSlug = currentTournamentSlug();
  const want = `#/${activeSport}${tSlug ? '/' + tSlug : ''}`;
  if (location.hash !== want) { location.hash = want; return; }  // hashchange re-renders

  renderSidebar();
  renderTopbar();
  renderMatchList();
}

/* ===========================================================================
   Discrepancy drawer
   =========================================================================== */
function toggleDisc(force) {
  discOpen = force === undefined ? !discOpen : !!force;
  const panel = document.getElementById('disc-panel');
  panel.classList.toggle('open', discOpen);
  panel.setAttribute('aria-hidden', String(!discOpen));
  document.getElementById('disc-scrim').classList.toggle('show', discOpen);
  if (discOpen) renderErrorLog();
}

function getProbDiff(m, cfg, n) {
  const pre = cfg.oc(n);
  const og = m[pre + 'og_prob'];
  const fair = m[pre + 'fair_prob'];
  if (og == null || fair == null) return null;
  const diff = Math.abs(og - fair);
  return { mode: 'prob', ogProb: og, fairProb: fair, diff, pct: diff / 100 };
}
function getOddsRange(m, cfg, n) {
  const vals = [];
  for (const b of cfg.books) {
    const v = m[b['col' + n]];
    if (v != null) vals.push(v);
  }
  if (vals.length < 2) return null;
  const min = Math.min(...vals), max = Math.max(...vals);
  const avg = (min + max) / 2;
  if (avg === 0) return null;
  return { mode: 'range', min, max, diff: max - min, pct: (max - min) / avg };
}

function findDiscrepancies(slug, cfg, grouped) {
  const out = [];
  for (const m of getEventMarkets(grouped, slug)) {
    const outcomes = m.oc3_name ? [1, 2, 3] : [1, 2];
    for (const oc of outcomes) {
      const r = discMode === 'prob' ? getProbDiff(m, cfg, oc) : getOddsRange(m, cfg, oc);
      if (r && r.pct > discThreshold) {
        out.push({ question: m.question, type: m.sports_market_type, outcome: m[cfg.oc(oc) + 'name'], slug, ...r });
      }
    }
  }
  return out;
}

function renderDiscTabs() {
  const modeEl = document.getElementById('disc-mode');
  const tabsEl = document.getElementById('disc-tabs');
  if (!modeEl || !tabsEl) return;
  modeEl.innerHTML = [
    { key: 'range', label: 'Book spread' },
    { key: 'prob', label: 'Orig vs Fair' },
  ].map(m => `<button class="disc-mode-tab${m.key === discMode ? ' active' : ''}" onclick="setDiscMode('${m.key}')">${m.label}</button>`).join('');

  tabsEl.innerHTML = (DISC_THRESHOLDS[discMode] || []).map(t => {
    const pct = t * 100;
    const label = (pct < 1 ? pct.toFixed(1) : pct.toFixed(0)) + '%';
    return `<button class="disc-tab${t === discThreshold ? ' active' : ''}" onclick="setDiscThreshold(${t})">${label}</button>`;
  }).join('');
}
function setDiscMode(m) {
  discMode = m;
  if (!DISC_THRESHOLDS[m].includes(discThreshold)) discThreshold = DISC_THRESHOLDS[m][m === 'range' ? 1 : 1];
  renderDiscTabs();
  renderErrorLog();
}
function setDiscThreshold(t) { discThreshold = t; renderDiscTabs(); renderErrorLog(); }

function renderErrorLog() {
  const listEl = document.getElementById('error-log-list');
  const countEl = document.getElementById('error-count');
  const scopeEl = document.getElementById('disc-scope');
  if (!listEl) return;
  renderDiscTabs();

  const data = sportData[activeSport];
  const cfg = SPORTS[activeSport];
  if (activeSport && loadingKind) {
    // Mid-load: rows are coming, so show their shape rather than "no results".
    listEl.innerHTML = skeletonDiscList();
    if (scopeEl) scopeEl.innerHTML = 'Scanning…';
    setDiscCount(null);
    return;
  }
  if (!activeSport || !data || !data.grouped) {
    listEl.innerHTML = '<div class="error-log-empty">Pick a sport to scan for discrepancies.</div>';
    setDiscCount(0);
    if (scopeEl) scopeEl.innerHTML = '';
    return;
  }

  const detail = (d) => d.mode === 'prob'
    ? `Orig <b>${d.ogProb.toFixed(1)}%</b> vs Fair <b>${d.fairProb.toFixed(1)}%</b>`
    : `Range <b>${d.min.toFixed(2)} – ${d.max.toFixed(2)}</b>`;

  let html = '', total = 0;

  if (currentSlug) {
    const ev = currentEvent();
    if (scopeEl) scopeEl.innerHTML = `Within <b>${escHtml(ev ? ev.title : 'this event')}</b>`;
    const discs = findDiscrepancies(currentSlug, cfg, data.grouped)
      .sort((a, b) => b.pct - a.pct);
    total = discs.length;
    if (!discs.length) {
      html = '<div class="error-log-empty">Nothing above the threshold for this event.</div>';
    } else {
      for (const d of discs) {
        html += `<div class="error-log-item" onclick="selectMarketType('${jsStr(d.type)}')">
          <div class="eli-detail">
            <span class="eli-market">${escHtml(formatMarketType(d.type))}</span> · ${escHtml(d.outcome)}<br>
            ${detail(d)} — <span class="eli-range">${(d.pct * 100).toFixed(1)}%</span>
          </div>
        </div>`;
      }
    }
  } else {
    const events = data.events || [];
    if (scopeEl) {
      scopeEl.innerHTML = `Across <b>${events.length}</b> event${events.length === 1 ? '' : 's'} · ` +
        `<b>${escHtml(currentTournamentLabel() || 'all tournaments')}</b>, ${escHtml(periodLabel())}`;
    }
    const rows = [];
    for (const ev of events) {
      const discs = findDiscrepancies(ev.slug, cfg, data.grouped);
      if (discs.length) rows.push({ ev, discs, worst: discs.reduce((a, b) => a.pct > b.pct ? a : b) });
    }
    rows.sort((a, b) => b.worst.pct - a.worst.pct);
    total = rows.length;
    if (!rows.length) {
      html = '<div class="error-log-empty">No discrepancies above the threshold.</div>';
    } else {
      for (const { ev, discs, worst } of rows) {
        html += `<div class="error-log-item" onclick="openDetail('${escAttr(ev.slug)}')">
          <div class="eli-event">${escHtml(ev.title)}</div>
          <div class="eli-detail">
            ${discs.length} market${discs.length > 1 ? 's' : ''} · worst <span class="eli-range">${(worst.pct * 100).toFixed(1)}%</span><br>
            <span class="eli-market">${escHtml(formatMarketType(worst.type))}</span> ${detail(worst)}
          </div>
        </div>`;
      }
    }
  }

  if (countEl) countEl.textContent = total;
  setDiscCount(total);
  listEl.innerHTML = html;
}

// `null` means "not counted yet" — shown as a dash, so a stale number from the
// previous sport never reads as this one's result.
function setDiscCount(n) {
  discCount = n == null ? 0 : n;
  const label = n == null ? '–' : String(n);
  const btn = document.getElementById('disc-btn-count');
  if (btn) {
    btn.textContent = label;
    btn.classList.toggle('zero', n == null || n === 0);
  }
  const head = document.getElementById('error-count');
  if (head) head.textContent = label;
}

/* ===========================================================================
   Home
   =========================================================================== */
function renderHomeView() {
  setDetailMode(false);
  const view = document.getElementById('home-view');
  document.getElementById('match-list-view').style.display = 'none';
  const detail = document.getElementById('detail-view');
  detail.classList.remove('active');
  detail.innerHTML = '';

  const cutoff = recentCutoff();
  const tiles = Object.entries(SPORTS).map(([key, cfg]) => {
    const dr = sportData[key]?.dateRange;
    const hasData = !!(dr && dr.max);
    const calendar = inSeasonByCalendar(key);
    const veryRecent = hasData && dr.max >= cutoff;
    const isActive = calendar === null ? veryRecent : (calendar || veryRecent);
    return { key, cfg, dr, hasData, isActive, monthsCount: dr?.combos?.length ?? 0, sortKey: dr?.max || '' };
  }).sort((a, b) => {
    if (a.isActive !== b.isActive) return a.isActive ? -1 : 1;
    if (a.hasData !== b.hasData) return a.hasData ? -1 : 1;
    return b.sortKey.localeCompare(a.sortKey) || a.cfg.label.localeCompare(b.cfg.label);
  });

  const fmtMonth = (s) => s ? new Date(s + 'T00:00:00Z').toLocaleDateString('en-US', { month: 'short', year: 'numeric', timeZone: 'UTC' }) : '—';
  // A tile whose date range hasn't landed keeps the real frame, icon and name —
  // only the two data lines are bars. Nothing moves when the range arrives.
  const tile = (t) => {
    if (!t.hasData) {
      return `<a class="home-tile ${t.isActive ? '' : 'off'}" href="#/${t.key}">
        <div class="ht-head">
          ${sportIconHtml(t.key, 'ht-icon')}
          <div class="ht-name">${escHtml(t.cfg.label)}</div>
          ${bar('58px', 17, '999px')}
        </div>
        ${bar('136px', 16)}
        <div class="ht-foot">${bar('82px', 12)}${bar('66px', 12)}</div>
      </a>`;
    }
    const status = t.isActive ? { cls: 'active', text: 'Active' } : { cls: 'off', text: 'Off-season' };
    return `<a class="home-tile ${t.isActive ? '' : 'off'}" href="#/${t.key}">
      <div class="ht-head">
        ${sportIconHtml(t.key, 'ht-icon')}
        <div class="ht-name">${escHtml(t.cfg.label)}</div>
        <span class="ht-status ${status.cls}">${status.text}</span>
      </div>
      <div class="ht-range">${fmtMonth(t.dr?.min)} → ${fmtMonth(t.dr?.max)}</div>
      <div class="ht-foot">
        ${seasonLabel(t.key) ? `<span class="ht-season">${escHtml(seasonLabel(t.key))}</span>` : ''}
        ${t.monthsCount ? `<span class="ht-months">${t.monthsCount} mo of data</span>` : ''}
      </div>
    </a>`;
  };

  const on = tiles.filter(t => t.isActive), off = tiles.filter(t => !t.isActive);
  let html = `<div class="home-hero">
      <h2><b>Odds</b> Library</h2>
      <p>Bookmaker prices, fair values and cross-book discrepancies for every sport we capture.
         Pick a sport, then drill into a tournament.</p>
    </div>`;
  if (on.length) html += `<div class="home-section-title">In season</div><div class="home-grid">${on.map(tile).join('')}</div>`;
  if (off.length) html += `<div class="home-section-title">Off-season / archive</div><div class="home-grid">${off.map(tile).join('')}</div>`;

  view.innerHTML = html;
  view.style.display = '';
}

/* ===========================================================================
   Match list
   =========================================================================== */
function renderMatchList() {
  const data = sportData[activeSport];
  const listEl = document.getElementById('match-list-view');
  if (!data) return;

  const events = (data.events || []).filter(ev => evHasMarkets(ev, data.grouped));
  const tours = data.tournaments || [];
  const needsPick = !selectedTournament && (data.monthRows || 0) > MONTH_ROW_BUDGET && !data.loadedScope;

  let html = `<div class="list-head">
      <h2>${escHtml(currentTournamentLabel() || SPORTS[activeSport].label)}</h2>
      <div class="lh-sub"><b>${events.length}</b> event${events.length === 1 ? '' : 's'}${periodLabel() ? ' · ' + escHtml(periodLabel()) : ''}</div>
    </div>`;

  if (needsPick) {
    html += renderTournamentPicker(tours);
  } else if (!events.length) {
    html += `<div class="empty-state">
        <div class="es-title">Nothing to show for ${escHtml(periodLabel())}</div>
        <div class="es-sub">No ${escHtml(currentTournamentLabel() || SPORTS[activeSport].label)} events with markets in this period. Try another month.</div>
      </div>`;
    if (tours.length) html += renderTournamentPicker(tours);
  } else {
    const sorted = [...events].sort((a, b) => new Date(a.start_time_utc) - new Date(b.start_time_utc));
    const perDay = new Map();
    for (const ev of sorted) {
      const k = dayKey(ev.start_time_utc);
      if (!perDay.has(k)) perDay.set(k, []);
      perDay.get(k).push(ev);
    }
    for (const [, evs] of perDay) {
      html += `<div class="day-head">${escHtml(dayLabel(evs[0].start_time_utc))}<span class="dh-n">${evs.length}</span></div>`;
      html += '<div class="match-grid">';
      for (const ev of evs) html += renderMatchCard(ev, getEventMarkets(data.grouped, ev.slug));
      html += '</div>';
    }
  }

  listEl.innerHTML = html;
  listEl.style.display = '';
  renderErrorLog();
}

function renderTournamentPicker(tours) {
  if (!tours.length) return '';
  return `<div class="tp-wrap">
      <div class="tp-head">
        <div class="tp-title">Pick a tournament</div>
        <div class="tp-sub">${escHtml(SPORTS[activeSport].label)} runs ${tours.length} competition${tours.length === 1 ? '' : 's'} in ${escHtml(periodLabel())} — more data than is worth loading at once.</div>
      </div>
      <div class="tp-grid">
        ${tours.map(t => `<div class="tp-item" onclick="selectTournament('${jsStr(t.id)}')">
            <span class="tp-name">${escHtml(t.label)}</span>
            <span class="tp-n">${t.rows.toLocaleString()}</span>
          </div>`).join('')}
      </div>
    </div>`;
}

function renderMatchCard(ev, mkts) {
  const isLive = ev.live && !ev.ended;
  const isFinal = !!ev.ended;
  const statusClass = isLive ? 'live' : isFinal ? 'final' : 'upcoming';
  const statusText = isLive ? '<span class="pulse-dot"></span> Live'
    : isFinal ? '<span class="final-dot"></span> Final' : 'Upcoming';
  const noOdds = mkts.length > 0 && !mkts.some(marketHasAnyPrice);

  const types = [...new Set(mkts.map(m => m.sports_market_type))].sort(compareMarkets);
  const LIMIT = 4;
  const chips = types.slice(0, LIMIT).map(t => `<span class="mc-market-chip">${escHtml(formatMarketType(t))}</span>`).join('') +
    (types.length > LIMIT ? `<span class="mc-market-chip more">+${types.length - LIMIT}</span>` : '');

  return `<div class="match-card" onclick="openDetail('${escAttr(ev.slug)}')">
    <div class="mc-top">
      <div class="mc-tournament">${escHtml(ev.tournament || SPORTS[activeSport].label)}</div>
      <span class="mc-status ${statusClass}">${statusText}</span>
    </div>
    <div class="mc-teams">${splitTitle(ev.title)}</div>
    <div class="mc-meta">
      ${ev.score ? `<span class="mc-score">${escHtml(ev.score)}</span>` : ''}
      <span class="mc-when">${escHtml(fmtTime(ev.start_time_utc))}</span>
      ${noOdds ? '<span class="mc-no-odds">No prices</span>' : ''}
    </div>
    ${types.length ? `<div class="mc-markets">${chips}</div>` : ''}
  </div>`;
}

/* ===========================================================================
   Event detail — market tabs
   =========================================================================== */
/* Only an open event pins its header; every other view scrolls the page. */
function setDetailMode(on) {
  const c = document.querySelector('.content');
  if (c) c.classList.toggle('detail-mode', !!on);
}

function openDetail(slug) { navigate(activeSport, slug); }
function closeDetail() { navigate(activeSport, null); }

function openDetailDirect(slug) {
  currentSlug = slug;
  const data = sportData[activeSport];
  const cfg = SPORTS[activeSport];
  const ev = (data?.events || []).find(e => e.slug === slug);
  const detailEl = document.getElementById('detail-view');
  document.getElementById('match-list-view').style.display = 'none';
  document.getElementById('home-view').style.display = 'none';
  detailEl.classList.add('active');

  if (!ev) {
    setDetailMode(false);
    detailEl.innerHTML = `<button class="back-btn" onclick="closeDetail()">${ICON.back} Back</button>
      <div class="empty-state">
        <div class="es-title">Event not in the loaded period</div>
        <div class="es-sub">Pick its tournament in the sidebar, or change the month.</div>
      </div>`;
    renderTopbar();
    return;
  }

  const mkts = getEventMarkets(data.grouped, slug);
  detailByType = {};
  for (const m of mkts) (detailByType[m.sports_market_type] = detailByType[m.sports_market_type] || []).push(m);
  detailTypes = Object.keys(detailByType).sort(compareMarkets);
  if (!detailTypes.includes(activeMarketType)) activeMarketType = detailTypes[0] || null;
  detailCfg = cfg;

  const statusText = ev.ended ? 'Final' : ev.live ? 'Live' : 'Upcoming';
  let html = `<div class="detail-sticky">
    <div class="detail-top">
      <button class="back-btn" onclick="closeDetail()">${ICON.back} Back</button>
    </div>
    <div class="detail-header">
      <div class="dh-main">
        <div class="dh-eyebrow">
          ${sportIconHtml(activeSport, 'dh-ico')}
          ${escHtml(ev.tournament || cfg.label)}
        </div>
        <div class="dh-title">${splitTitle(ev.title)}</div>
        <div class="dh-meta">
          <span>${escHtml(fmtDate(ev.start_time_utc))}</span>
          <span class="dh-pill ${ev.ended ? 'final' : ev.live ? 'live' : 'upcoming'}">${statusText}</span>
          ${ev.location ? `<span>${escHtml(ev.location)}</span>` : ''}
          <span>${mkts.length} market${mkts.length === 1 ? '' : 's'}</span>
        </div>
      </div>
      ${ev.score ? `<div class="dh-scorebox">
          <div class="dh-num">${escHtml(ev.score)}</div>
          <div class="dh-cap">${ev.ended ? 'Final' : 'Live'}</div>
        </div>` : ''}
    </div>`;

  html += renderMarketTabs();
  html += '</div>';                      // /detail-sticky — the table scrolls under it
  html += '<div id="market-panel"></div>';

  detailEl.innerHTML = html;
  renderMarketPanel();
  renderTopbar();
  renderErrorLog();
  setDetailMode(true);
  const c = document.querySelector('.content');
  if (c) c.scrollTop = 0;

function renderMarketTabs() {
  if (!detailTypes.length) return '';
  return '<div class="mkt-tabs">' + detailTypes.map(t =>
    `<button class="mkt-tab ${t === activeMarketType ? 'active' : ''}" data-type="${escAttr(t)}" onclick="selectMarketType('${jsStr(t)}')">
      ${escHtml(formatMarketType(t))}<span class="mt-n">${detailByType[t].length}</span>
    </button>`).join('') + '</div>';
}

function selectMarketType(type) {
  if (!detailByType[type]) return;
  activeMarketType = type;
  document.querySelectorAll('.mkt-tab').forEach(el => el.classList.toggle('active', el.dataset.type === type));
  renderMarketPanel();
}

function renderMarketPanel() {
  const el = document.getElementById('market-panel');
  if (!el) return;
  if (!activeMarketType) {
    el.innerHTML = '<div class="empty-state"><div class="es-title">No markets captured for this event</div></div>';
    return;
  }
  const rows = detailByType[activeMarketType] || [];
  // No heading: the active tab already names the market and counts its lines.
  el.innerHTML = renderOddsTable(rows, detailCfg, activeMarketType);
}

async function refreshDetail() {
  if (!currentSlug) return;
  const btn = document.getElementById('refresh-btn');
  const lbl = document.getElementById('refresh-label');
  if (btn) btn.disabled = true;
  if (lbl) lbl.textContent = 'Refreshing…';
  try {
    const slug = currentSlug;
    const d = sportData[activeSport];
    if (d) d.loadedScope = null;   // force a re-fetch
    await loadScoped(activeSport);
    openDetailDirect(slug);
    const l2 = document.getElementById('refresh-label');
    if (l2) l2.textContent = 'Updated ' + new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
  } catch (err) {
    const l2 = document.getElementById('refresh-label');
    if (l2) l2.textContent = 'Failed';
    console.error(err);
  } finally {
    const b2 = document.getElementById('refresh-btn');
    if (b2) b2.disabled = false;
  }
}

/* ===========================================================================
   Odds table
   =========================================================================== */
function formatOutcome(outcome) {
  if (!outcome) return '-';
  const match = outcome.match(/^(.+?)\s+([+-]?\d+(?:\.\d+)?)$/);
  if (match) {
    const [, name, line] = match;
    if (name.length <= 10) return escHtml(outcome);
    return `<span class="oc-name">${escHtml(name)}</span> <span class="oc-line">${escHtml(line)}</span>`;
  }
  return `<span class="oc-name oc-name-solo" title="${escAttr(outcome)}">${escHtml(outcome)}</span>`;
}

function formatQuestion(q, marketType, line) {
  const mt = (marketType || '').toLowerCase();
  if (mt === 'moneyline' || mt === 'h2h' || mt.endsWith('_h2h') || mt === 'dnb' || mt === 'btts' || mt === 'double_chance') {
    return 'H2H';
  }
  if (mt === 'totals' || mt === 'total' || mt.endsWith('_total') || mt === 'total_sets' ||
      mt === 'total_games' || mt.endsWith('_total_games') || mt.endsWith('_total_sets')) {
    if (line != null) return `O/U ${line}`;
    const ou = (q || '').match(/O\/U\s*([\d.]+)/i);
    return ou ? `O/U ${ou[1]}` : 'O/U';
  }
  if (mt === 'spreads' || mt === 'spread' || mt.endsWith('_spread')) {
    return line != null ? `Line ${line}` : 'Line';
  }
  return q || '';
}

function buildRow(m, n, cfg) {
  const pre = cfg.oc(n);
  const row = { outcome: m[pre + 'name'] || '' };

  const oddsVals = [];
  for (const b of cfg.books) {
    const v = m[b['col' + n]];
    row['odds_' + b.key] = v;
    if (v != null) oddsVals.push(v);
  }
  const fairVals = [];
  for (const fb of cfg.fairBooks) {
    const v = m[fb['col' + n]];
    row['fair_' + fb.key] = v;
    if (v != null) fairVals.push(v);
  }

  const mean = (a) => a.reduce((s, v) => s + v, 0) / a.length;
  row.blendedOdds = m[pre + 'og_blend'] ?? (oddsVals.length ? mean(oddsVals) : null);
  row.blendedFair = m[pre + 'fair_blend'] ?? (fairVals.length ? mean(fairVals) : null);

  const span = (vals) => vals.length > 1
    ? { min: Math.min(...vals), max: Math.max(...vals), range: Math.max(...vals) - Math.min(...vals) }
    : vals.length === 1 ? { min: vals[0], max: vals[0], range: 0 } : { min: null, max: null, range: null };

  const o = span(oddsVals);
  row.oddsRangeMin = o.min; row.oddsRangeMax = o.max; row.oddsRange = o.range;
  const f = span(fairVals);
  row.fairRangeMin = f.min; row.fairRangeMax = f.max; row.fairRange = f.range;

  row.origProb = m[pre + 'og_prob'];
  row.fairProb = m[pre + 'fair_prob'];
  return row;
}

function renderOddsTable(markets, cfg, type) {
  // Every market yields one row per outcome; three-way markets carry oc3.
  const tableRows = [];
  for (const m of markets) {
    const rows = [buildRow(m, 1, cfg), buildRow(m, 2, cfg)];
    if (m.oc3_name) rows.push(buildRow(m, 3, cfg));
    tableRows.push({ question: formatQuestion(m.question, m.sports_market_type, m.line), m, rows });
  }

  // Only show a column when this market group actually holds values for it —
  // every sport shares one wide schema, so most books are empty most of the time.
  const hasBookData = (b) => markets.some(m => [b.col1, b.col2, b.col3].some(c => c && m[c] != null));
  const anyVal = (key) => tableRows.some(tr => tr.rows.some(r => r[key] != null));

  const visibleBooks = cfg.books.filter(hasBookData);
  const visibleFair = cfg.fairBooks.filter(hasBookData);

  const cols = [
    { key: 'question', label: 'Line', sortable: false, type: 'text' },
    { key: 'outcome', label: 'Outcome', sortable: false, type: 'text' },
  ];
  for (const b of visibleBooks) {
    cols.push({ key: 'odds_' + b.key, label: b.label, sortable: true, type: 'num',
                html: bookHeader(b.key, b.label, false) });
  }
  for (const b of visibleFair) {
    // fairBooks keys are the book key with a `_fair` suffix.
    const base = b.key.replace(/_fair$/, '');
    cols.push({ key: 'fair_' + b.key, label: b.label, sortable: true, type: 'num',
                html: bookHeader(base, b.label, true) });
  }
  if (anyVal('blendedOdds')) cols.push({ key: 'blendedOdds', label: 'Blend', sortable: true, type: 'num' });
  if (anyVal('blendedFair')) cols.push({ key: 'blendedFair', label: 'Fair Blend', sortable: true, type: 'num' });
  if (anyVal('oddsRange')) cols.push({ key: 'oddsRange', label: 'Odds Range', sortable: true, type: 'num' });
  if (anyVal('fairRange')) cols.push({ key: 'fairRange', label: 'Fair Range', sortable: true, type: 'num' });
  if (anyVal('origProb')) cols.push({ key: 'origProb', label: 'Orig %', sortable: true, type: 'num' });
  if (anyVal('fairProb')) cols.push({ key: 'fairProb', label: 'Fair %', sortable: true, type: 'num' });

  const tableId = 'tbl-' + slugify(type) + '-' + Math.random().toString(36).slice(2, 8);

  let html = `<div class="table-wrapper"><table class="odds-table" id="${tableId}"><thead><tr>`;
  for (const c of cols) {
    html += `<th data-col="${c.key}" title="${escAttr(c.label)}"${c.sortable ? ` onclick="sortTable('${tableId}', '${c.key}', '${c.type}')"` : ''}>${c.html || escHtml(c.label)}${c.sortable ? '<span class="sort-arrow"></span>' : ''}</th>`;
  }
  html += '</tr></thead><tbody>';

  for (let i = 0; i < tableRows.length; i++) {
    const tr = tableRows[i];
    const n = tr.rows.length;
    for (let r = 0; r < n; r++) {
      const row = tr.rows[r];
      const last = r === n - 1;
      html += `<tr class="${last ? 'group-row' : ''}" data-sort-group="${i}">`;

      for (const col of cols) {
        if (col.key === 'question') {
          if (r === 0) html += `<td class="question-cell" rowspan="${n}">${escHtml(tr.question || '')}</td>`;
          continue;
        }
        if (col.key === 'outcome') {
          html += `<td class="outcome-cell">${formatOutcome(row.outcome)}</td>`;
          continue;
        }

        const val = row[col.key];
        let cls = 'odds-val', display = '-';

        if (val != null) {
          if (col.key === 'oddsRange' || col.key === 'fairRange') {
            const min = col.key === 'oddsRange' ? row.oddsRangeMin : row.fairRangeMin;
            const max = col.key === 'oddsRange' ? row.oddsRangeMax : row.fairRangeMax;
            display = min != null ? `${min.toFixed(2)}–${max.toFixed(2)}` : val.toFixed(2);
            const avg = min != null ? (min + max) / 2 : 0;
            if (avg > 0 && val / avg > discThreshold) cls = 'highlight-red';
          } else if (col.key === 'origProb' || col.key === 'fairProb') {
            display = val.toFixed(1) + '%';
            cls = 'prob-cell';
          } else {
            display = val.toFixed(2);
            // Mark the best available price across books for this outcome.
            if (col.key.startsWith('odds_') && row.oddsRangeMax != null &&
                row.oddsRangeMax !== row.oddsRangeMin && val === row.oddsRangeMax) {
              cls = 'odds-val best-odds';
            }
          }
        } else {
          cls = 'null-val';
        }
        html += `<td class="${cls}" data-val="${val != null ? val : ''}">${display}</td>`;
      }
      html += '</tr>';
    }
  }
  return html + '</tbody></table></div>';
}

/* ---- Sorting --------------------------------------------------------------- */
const sortState = {};

function sortTable(tableId, colKey, colType) {
  const table = document.getElementById(tableId);
  if (!table) return;
  const tbody = table.querySelector('tbody');
  const rows = Array.from(tbody.querySelectorAll('tr'));

  // Rows belonging to one market move together (2 outcomes, or 3 when there's a draw).
  const groups = [];
  let cur = null, curKey = null;
  for (const row of rows) {
    const k = row.dataset.sortGroup;
    if (k !== curKey) { cur = []; groups.push(cur); curKey = k; }
    cur.push(row);
  }

  const prev = sortState[tableId];
  const dir = prev && prev.col === colKey && prev.dir === 'asc' ? 'desc' : 'asc';
  sortState[tableId] = { col: colKey, dir };

  const ths = Array.from(table.querySelectorAll('thead th'));
  const colIdx = ths.findIndex(th => th.dataset.col === colKey);
  if (colIdx === -1) return;
  ths.forEach(th => { const a = th.querySelector('.sort-arrow'); if (a) a.textContent = ''; });
  const arrow = ths[colIdx].querySelector('.sort-arrow');
  if (arrow) arrow.textContent = dir === 'asc' ? ' ▲' : ' ▼';

  groups.sort((a, b) => {
    const va = getSortVal(a[0], colIdx, colType);
    const vb = getSortVal(b[0], colIdx, colType);
    if (va == null && vb == null) return 0;
    if (va == null) return 1;
    if (vb == null) return -1;
    if (colType === 'num') return dir === 'asc' ? va - vb : vb - va;
    return dir === 'asc' ? String(va).localeCompare(String(vb)) : String(vb).localeCompare(String(va));
  });

  for (const g of groups) for (const row of g) tbody.appendChild(row);
}

function getSortVal(row, colIdx, colType) {
  const cell = row.querySelectorAll('td')[colIdx];
  if (!cell) return null;
  if (colType === 'num') {
    const dv = cell.dataset.val;
    if (dv !== undefined && dv !== '') return parseFloat(dv);
    const num = parseFloat(cell.textContent.replace('%', '').trim());
    return isNaN(num) ? null : num;
  }
  return cell.textContent.trim();
}

/* ===========================================================================
   Search
   =========================================================================== */
let searchDebounce = null;
function handleTeamSearch(query) {
  clearTimeout(searchDebounce);
  const container = document.getElementById('search-results');
  if (!query || query.trim().length < 2) { container.innerHTML = ''; return; }
  searchDebounce = setTimeout(() => runTeamSearch(query.trim().toLowerCase()), 220);
}

async function runTeamSearch(q) {
  const container = document.getElementById('search-results');
  container.innerHTML = skeletonSearch();

  const vsParts = q.split(/\s+vs?\.?\s+/i).map(s => s.trim()).filter(Boolean);
  const twoTeam = vsParts.length >= 2;
  const q1 = vsParts[0] || q, q2 = twoTeam ? vsParts[1] : null;

  const results = [], seen = new Set();
  await Promise.all(Object.entries(SPORTS).map(async ([key, cfg]) => {
    // `select=*` rather than a column list: participant columns differ per sport
    // (home_team / player1 / fighter1 / team1), and naming one a table lacks makes
    // PostgREST 400 the whole query — which the catch below would swallow silently.
    let params = 'select=*';
    params += `&or=(oc1_name.ilike.*${q1}*,oc2_name.ilike.*${q1}*)`;
    if (twoTeam) params += `&or=(oc1_name.ilike.*${q2}*,oc2_name.ilike.*${q2}*)`;
    params += `&sports_market_type=eq.h2h&order=date.desc&limit=15`;
    try {
      const rows = await qOdds(cfg.table, params);
      for (const m of rows) {
        const [t1, t2] = participants(m);
        const slug = eventSlug(key, m);
        if (seen.has(slug)) continue;
        seen.add(slug);
        results.push({
          sport: key, label: cfg.label, title: (t1 && t2) ? `${t1} vs ${t2}` : (t1 || t2),
          date: m.date, tournament: m.tournament || null, slug,
          score: (m.home_score != null && m.away_score != null) ? `${m.home_score}-${m.away_score}` : null,
          commenceTime: m.commence_time,
        });
      }
    } catch { /* a sport without the searched name simply contributes nothing */ }
  }));

  results.sort((a, b) => b.date.localeCompare(a.date));
  if (!results.length) {
    container.innerHTML = '<div class="search-no-results">No matches found</div>';
    return;
  }
  container.innerHTML = results.slice(0, 30).map(r => `
    <div class="search-result-item" onclick="openSearchResult('${r.sport}', '${escAttr(r.slug)}', '${jsStr(r.tournament || '')}')">
      <div class="sr-teams">${escHtml(r.title)}</div>
      <div class="sr-meta">
        <span class="sr-sport">${escHtml(r.label)}</span>
        ${r.tournament ? ' · ' + escHtml(r.tournament) : ''}
        · ${escHtml(fmtDate(r.commenceTime || r.date + 'T00:00:00Z'))}
        ${r.score ? `<span class="sr-score"> · ${escHtml(r.score)}</span>` : ''}
      </div>
    </div>`).join('');
}

// Search crosses sports and tournaments, so carry the tournament into the URL —
// without it the event's month would load under a different scope and go missing.
function openSearchResult(sport, slug, tournament) {
  document.getElementById('team-search').value = '';
  document.getElementById('search-results').innerHTML = '';
  navigate(sport, slug, tournament ? slugify(tournament) : null);
  toggleSidebar(false);
}

/* ===========================================================================
   Routing  —  #/{sport}/{tournament}/{event}
   =========================================================================== */
function currentTournamentSlug() { return selectedTournament || null; }
// Matches the entry id, any spelling the league has had, or the raw sport_key —
// so links made before the merge (…/aussierules-afl) still land correctly.
function findTournamentBySlug(sportKey, tSlug) {
  const entries = sportData[sportKey]?.tournamentEntries || [];
  const hit = entries.find(e =>
    e.id === tSlug ||
    slugify(e.sportKey) === tSlug ||
    e.labels.some(l => slugify(l) === tSlug));
  return hit ? hit.id : null;
}

function goHome() {
  if (location.hash === '' || location.hash === '#' || location.hash === '#/') handleRoute();
  else location.hash = '#/';
}

function navigate(sport, slug, tournament) {
  if (tournament === undefined) tournament = currentTournamentSlug();
  let hash = `#/${sport}`;
  if (tournament) hash += `/${tournament}`;
  if (slug) hash += `/${slug}`;
  if (location.hash !== hash) location.hash = hash;
  else handleRoute();
}

function parseRoute() {
  const parts = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
  const sport = SPORTS[parts[0]] ? parts[0] : null;
  let tournament = null, slug = null;
  if (sport && parts[1]) {
    // Event slugs start with `${sport}-` AND carry the fixture date (see eventSlug).
    // The prefix alone isn't enough to tell them apart from a tournament: "Aussierules
    // Afl" slugifies to `aussierules-afl`, which would otherwise read as an event.
    if (parts[1].startsWith(`${sport}-`) && /\d{4}-\d{2}-\d{2}/.test(parts[1])) {
      slug = parts.slice(1).join('/');
    } else {
      tournament = parts[1];
      slug = parts.slice(2).join('/') || null;
    }
  }
  return { sport, tournament, slug };
}

/* Open on the month we are in, not on the last month with any data. Several
   sports carry fixtures scheduled months or years out — MMA's furthest row sits
   in 2027 — and landing there showed a near-empty board for a sport that has a
   full card this week. Falls back to the closest month that exists. */
function defaultPeriod(combos) {
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth() + 1;
  const exact = combos.find(c => c.year === y && c.month === m);
  if (exact) return exact;
  const target = y * 12 + m;
  return combos.reduce((best, c) =>
    Math.abs(c.year * 12 + c.month - target) < Math.abs(best.year * 12 + best.month - target) ? c : best,
    combos[0]);
}

// Pull the month out of a slug so a deep link can load the right period.
function extractDateFromSlug(slug) {
  if (!slug) return null;
  const matches = [...slug.matchAll(/(\d{4})-(\d{2})-(\d{2})/g)];
  if (!matches.length) return null;
  const last = matches[matches.length - 1];
  return { year: parseInt(last[1]), month: parseInt(last[2]) };
}

// Load whatever the current (sport, month, tournament) selection points at.
// The label to print on an event, resolved through the merge so a fixture never
// shows "Aussierules Afl" just because it landed during the rename window.
function canonicalTournamentLabel(key, m) {
  const entries = sportData[key]?.tournamentEntries || [];
  const hit = entries.find(e => e.sportKey === (m.sport_key || '') &&
    (e.filter.col === 'sport_key' || e.labels.includes(m.tournament)));
  return hit ? hit.label : null;
}

async function loadScoped(key) {
  const d = sportData[key] || {};
  const entry = currentTournamentEntry();
  if (!entry && (d.monthRows || 0) > MONTH_ROW_BUDGET) {
    // Too much to pull in one go — the picker takes over until a tournament is chosen.
    d.events = []; d.grouped = {}; d.loadedScope = null;
    return d;
  }
  return loadMarkets(key, selectedYear, selectedMonth, entry);
}

/* A hash change that lands mid-route used to be dropped outright: the URL moved
   but the view never followed, which is how closing an event could leave the
   page — and the discrepancy drawer — on the event you had just left. Queue the
   pass instead, so the final URL always wins. */
let _routing = false, _routeQueued = false;
async function handleRoute() {
  if (_routing) { _routeQueued = true; return; }
  _routing = true;
  try {
    const { sport, tournament, slug } = parseRoute();

    // ---- Home
    if (!sport) {
      activeSport = null; currentSlug = null; selectedTournament = null;
      selectedYear = null; selectedMonth = null;
      document.getElementById('loading').style.display = 'none';
      renderHomeView();
      renderSidebar();
      renderTopbar();
      toggleDisc(false);
      document.title = 'Odds Library';

      const missing = Object.keys(SPORTS).filter(k => !sportData[k]?.dateRange);
      if (missing.length) {
        Promise.allSettled(missing.map(k => loadDateRange(k))).then(() => {
          if (!parseRoute().sport) { renderHomeView(); renderSidebar(); }
        });
      }
      return;
    }

    document.getElementById('home-view').style.display = 'none';
    const sportChanged = sport !== activeSport;
    if (sportChanged) {
      currentSlug = null;
      selectedTournament = null;
      navFilter = '';
      selectedYear = null; selectedMonth = null;
      activeMarketType = null;
      const dv = document.getElementById('detail-view');
      dv.classList.remove('active'); dv.innerHTML = '';
    }
    activeSport = sport;

    // A deep-linked event may live in a different month than the default.
    const slugDate = extractDateFromSlug(slug);

    showLoading(slug ? 'detail' : 'list');
    try {
      const range = sportData[sport]?.dateRange || await loadDateRange(sport);
      if (!range.combos.length) {
        showLoading(null);
        document.getElementById('match-list-view').innerHTML =
          `<div class="notice">No data captured for ${escHtml(SPORTS[sport].label)} yet.</div>`;
        document.getElementById('match-list-view').style.display = '';
        renderSidebar(); renderTopbar();
        return;
      }
      if (slugDate) { selectedYear = slugDate.year; selectedMonth = slugDate.month; }
      if (!selectedYear || !selectedMonth) {
        const start = defaultPeriod(range.combos);
        selectedYear = start.year; selectedMonth = start.month;
      }

      await loadTournamentIndex(sport, selectedYear, selectedMonth);
      selectedTournament = tournament ? findTournamentBySlug(sport, tournament) : null;
      renderSidebar();
      // The row count is in now, so we know which shape is actually coming.
      if (!slug && !selectedTournament && (sportData[sport].monthRows || 0) > MONTH_ROW_BUDGET) {
        showLoading('picker');
      }
      await loadScoped(sport);
    } catch (err) {
      showLoading(null);
      document.getElementById('match-list-view').innerHTML =
        `<div class="notice" style="color:var(--neg)">Error loading ${escHtml(SPORTS[sport].label)}: ${escHtml(err.message)}</div>`;
      document.getElementById('match-list-view').style.display = '';
      console.error(err);
      renderSidebar(); renderTopbar();
      return;
    }
    showLoading(null);

    /* Clear the open event BEFORE the list renders. renderMatchList paints the
       discrepancy drawer, and the drawer is scoped to currentSlug — leaving the
       old slug set meant going back from an event kept the drawer showing that
       event's discrepancies over a list of every fixture. */
    if (!slug) {
      currentSlug = null;
      const dv = document.getElementById('detail-view');
      dv.classList.remove('active');
      dv.innerHTML = '';
      document.getElementById('match-list-view').style.display = '';
      setDetailMode(false);
    }

    renderSidebar();
    renderMatchList();

    // Non-blocking: the nav shows this month's tournaments straight away and
    // fills in the sport's full history as the scan walks it.
    loadAllTournaments(sport);

    if (slug) openDetailDirect(slug);
    renderTopbar();

    const ev = currentEvent();
    document.title = ev ? `${ev.title} · Odds Library`
      : `${currentTournamentLabel() || SPORTS[sport].label} · Odds Library`;
  } finally {
    _routing = false;
    if (_routeQueued) { _routeQueued = false; handleRoute(); }
  }
}

window.addEventListener('hashchange', handleRoute);
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  if (discOpen) toggleDisc(false);
  else toggleSidebar(false);
});

/* ===========================================================================
   Loading states
   =========================================================================== */
/* One shimmer bar. Sizes are given in the units the real element uses, so a
   skeleton can be written by reading the markup it stands in for. */
function bar(w, h, r) {
  return `<div class="skeleton skel-bar" style="width:${w};height:${h}px${r ? `;border-radius:${r}` : ''}"></div>`;
}
// Deterministic pseudo-random width so rows look like text, not a grid, but
// don't reshuffle on every re-render.
function vary(i, lo, hi) { return lo + ((i * 37) % (hi - lo + 1)); }

/* `loadingKind` lets the other renderers (sidebar, drawer) tell "nothing here"
   apart from "not here yet" — the two used to look identical. */
let loadingKind = null;

function showLoading(kind) {
  const el = document.getElementById('loading');
  loadingKind = kind || null;
  if (!kind) {
    // Drop the markup, not just its visibility: a hidden skeleton keeps a second
    // #load-msg in the document, and msg() would then write to the wrong one.
    el.style.display = 'none';
    el.innerHTML = '';
    return;
  }

  setDetailMode(false);   // the skeleton is a normal scrolling page
  el.style.display = '';
  el.innerHTML = kind === 'detail' ? skeletonDetail()
    : kind === 'picker' ? skeletonPicker()
    : skeletonMatchList();
  document.getElementById('match-list-view').style.display = 'none';
  document.getElementById('detail-view').classList.remove('active');
  // The drawer is scoped to whatever is loading, so it has to follow along —
  // otherwise it sits there showing the previous sport's findings.
  renderErrorLog();
}

// The list head + day-grouped card grid that renderMatchList lands.
function skeletonMatchList() {
  const card = (i) => `<div class="skel-card">
      <div class="skel-row">${bar(vary(i, 46, 78) + 'px', 10)}<div style="flex:1"></div>${bar('58px', 16, '999px')}</div>
      ${bar(vary(i, 62, 88) + '%', 15)}
      <div class="skel-row">${bar('54px', 13)}</div>
      <div class="skel-chips">${bar('58px', 15, '6px')}${bar('50px', 15, '6px')}${bar('42px', 15, '6px')}</div>
    </div>`;
  const group = (n, from) => `<div class="day-head">${bar('124px', 11)}</div>
    <div class="match-grid">${Array.from({ length: n }, (_, i) => card(from + i)).join('')}</div>`;

  return `<div class="list-head">${bar('190px', 22)}<div style="flex:1"></div>${bar('130px', 13)}</div>
    <div class="load-msg" id="load-msg">Loading…</div>
    ${group(4, 0)}${group(3, 4)}`;
}

// The header, tab strip and odds table that openDetailDirect lands. Without
// this a deep-linked event showed a grid of cards where a wide table was coming.
function skeletonDetail() {
  const COLS = [150, 120, 70, 70, 70, 70, 70, 70, 60, 60];
  const head = `<div class="skel-thead">${COLS.map(w => bar(w + 'px', 10)).join('')}</div>`;
  const row = (i) => `<div class="skel-trow">${COLS.map((w, c) =>
    bar((c < 2 ? vary(i + c, 60, 100) * w / 100 : w) + 'px', 12)).join('')}</div>`;

  return `<div class="detail-top">${bar('84px', 32, '10px')}</div>
    <div class="skel-detail-header">
      <div class="sdh-main">
        <div class="skel-row" style="display:flex;gap:8px;align-items:center">${bar('18px', 18, '5px')}${bar('130px', 10)}</div>
        ${bar('340px', 26)}
        <div class="sdh-meta">${bar('150px', 12)}${bar('58px', 12)}${bar('90px', 12)}</div>
      </div>
      ${bar('72px', 40, '8px')}
    </div>
    <div class="load-msg" id="load-msg">Loading…</div>
    <div class="skel-mkt-tabs">${[92, 78, 62, 104, 96].map(w => bar(w + 'px', 15)).join('')}</div>
    <div class="skel-table-wrap">${head}${Array.from({ length: 10 }, (_, i) => row(i)).join('')}</div>`;
}

// The "pick a tournament" panel a sport lands on when its month is too big to
// load whole — a card grid would be the wrong shape entirely.
function skeletonPicker() {
  const item = (i) => `<div class="tp-item">${bar(vary(i, 55, 90) + '%', 13)}<div style="flex:1"></div>${bar('34px', 11)}</div>`;
  return `<div class="list-head">${bar('190px', 22)}<div style="flex:1"></div>${bar('130px', 13)}</div>
    <div class="load-msg" id="load-msg">Loading…</div>
    <div class="tp-wrap">
      <div class="tp-head">${bar('170px', 15)}<div style="height:6px"></div>${bar('420px', 12)}</div>
      <div class="tp-grid">${Array.from({ length: 12 }, (_, i) => item(i)).join('')}</div>
    </div>`;
}

// Sidebar tournament rows, at .sb-tourn's height.
function skeletonTournaments(n = 7) {
  return `<div class="sb-tourns">${Array.from({ length: n }, (_, i) =>
    `<div class="skel-tourn">${bar(vary(i, 45, 92) + '%', 11)}</div>`).join('')}</div>`;
}

// Discrepancy rows, in .error-log-item's frame.
function skeletonDiscList(n = 5) {
  return Array.from({ length: n }, (_, i) => `<div class="error-log-item" style="cursor:default">
      ${bar(vary(i, 52, 86) + '%', 12)}
      <div style="height:6px"></div>
      ${bar(vary(i + 3, 60, 94) + '%', 10)}
      <div style="height:5px"></div>
      ${bar(vary(i + 1, 40, 70) + '%', 10)}
    </div>`).join('');
}

// Search results, in .search-result-item's frame.
function skeletonSearch(n = 4) {
  return Array.from({ length: n }, (_, i) => `<div class="search-result-item" style="cursor:default">
      ${bar(vary(i, 55, 92) + '%', 12)}
      <div style="height:5px"></div>
      ${bar(vary(i + 2, 40, 75) + '%', 9)}
    </div>`).join('');
}

/* ===========================================================================
   Init
   =========================================================================== */
async function init() {
  initSidebarCollapsed();
  renderSidebar();
  await handleRoute();
  const missing = Object.keys(SPORTS).filter(k => !sportData[k]?.dateRange);
  if (missing.length) {
    Promise.allSettled(missing.map(k => loadDateRange(k))).then(() => {
      renderSidebar();
      if (!parseRoute().sport) renderHomeView();
    });
  }
}

init().catch(err => {
  document.getElementById('loading').innerHTML = `<div class="notice" style="color:var(--neg)">Error: ${escHtml(err.message)}</div>`;
  document.getElementById('loading').style.display = '';
  console.error(err);
});
</script>
</body>
</html>
