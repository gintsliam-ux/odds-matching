<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%230a0e17'/><text x='16' y='22' text-anchor='middle' font-family='system-ui' font-size='18' font-weight='700' fill='%234a9eff'>OL</text></svg>">
<title>Odds Library</title>
<style>
  /* ============================================================
     Design tokens
     ============================================================ */
  :root {
    --bg: #070a11;
    --surface: #0d1220;
    --surface-2: #121a2c;
    --surface-3: #18223a;
    --line: #1e2840;
    --line-soft: #151d2f;

    --text: #e8edf7;
    --text-2: #93a2c0;
    --text-3: #5c6d90;

    --accent: #5b9dff;
    --accent-2: #8fc0ff;
    --accent-soft: rgba(91,157,255,0.12);
    --accent-line: rgba(91,157,255,0.34);

    --pos: #3ddc97;
    --neg: #ff6f6f;
    --warn: #ffc043;
    --violet: #a78bfa;

    --r-sm: 6px; --r-md: 10px; --r-lg: 14px; --r-pill: 999px;
    --sidebar-w: 264px;
    --disc-w: 392px;
    --shadow-lg: 0 16px 48px rgba(0,0,0,0.55);
    --shadow-sm: 0 2px 10px rgba(0,0,0,0.30);

    /* Legacy aliases — a few inline styles still reference these. */
    --card: var(--surface); --card2: var(--surface-2);
    --border: var(--line); --border2: var(--line-soft);
    --muted: var(--text-2); --dim: var(--text-3);
    --blue: var(--accent); --green: var(--pos); --red: var(--neg);
    --yellow: var(--warn); --purple: var(--violet);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  ::selection { background: var(--accent-line); color: #fff; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    height: 100vh;
    overflow: hidden;
    display: flex;
  }

  /* Thin, unobtrusive scrollbars everywhere. */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #222e4a; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #2e3d61; }

  button, select, input { font-family: inherit; }

  /* ============================================================
     App shell
     ============================================================ */
  .app-main {
    flex: 1; min-width: 0; display: flex; flex-direction: column;
    height: 100vh; position: relative;
  }
  .content {
    flex: 1; min-height: 0; overflow-y: auto;
    padding: 22px 28px 60px;
    background:
      radial-gradient(1200px 400px at 20% -10%, rgba(91,157,255,0.06), transparent 60%),
      var(--bg);
  }
  .content-inner { max-width: 1680px; margin: 0 auto; }

  /* ============================================================
     Sidebar
     ============================================================ */
  .sidebar {
    width: var(--sidebar-w); flex-shrink: 0;
    background: var(--surface);
    border-right: 1px solid var(--line);
    display: flex; flex-direction: column;
    height: 100vh; z-index: 40;
  }
  .sb-head {
    display: flex; align-items: center; gap: 8px;
    padding: 14px 12px 14px 16px; border-bottom: 1px solid var(--line-soft); flex-shrink: 0;
  }
  .sb-brand {
    display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0;
    cursor: pointer; user-select: none;
  }
  .sb-collapse {
    width: 26px; height: 26px; flex-shrink: 0; display: grid; place-items: center;
    background: transparent; border: 1px solid transparent; border-radius: var(--r-sm);
    color: var(--text-3); cursor: pointer; transition: all .15s;
  }
  .sb-collapse:hover { background: var(--surface-2); color: var(--text); border-color: var(--line); }
  .sb-collapse svg { transition: transform .2s ease; }

  .sb-search-mini {
    display: none; width: 34px; height: 34px; margin: 10px auto 2px;
    background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-md);
    color: var(--text-2); cursor: pointer; place-items: center; transition: all .15s;
  }
  .sb-search-mini:hover { border-color: var(--accent-line); color: var(--text); }
  .sb-mark {
    width: 30px; height: 30px; border-radius: 8px; flex-shrink: 0;
    background: linear-gradient(135deg, var(--accent) 0%, #2d6fd6 100%);
    display: grid; place-items: center;
    font-size: 12px; font-weight: 800; color: #fff; letter-spacing: -0.5px;
    box-shadow: 0 2px 12px rgba(91,157,255,0.35);
  }
  .sb-brand-text { font-size: 15px; font-weight: 700; color: #fff; letter-spacing: -0.2px; }
  .sb-brand-text b { color: var(--accent); }
  .sb-brand:hover .sb-brand-text { color: var(--accent-2); }

  .sb-search { padding: 12px 12px 6px; flex-shrink: 0; position: relative; }
  .sb-search-field { position: relative; }
  .sb-search-field svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); pointer-events: none; }
  .sb-search input {
    width: 100%; background: var(--surface-2); border: 1px solid var(--line);
    border-radius: var(--r-md); padding: 8px 10px 8px 30px; font-size: 13px; color: var(--text);
    outline: none; transition: border-color .15s, background .15s;
  }
  .sb-search input:focus { border-color: var(--accent-line); background: var(--surface-3); }
  .sb-search input::placeholder { color: var(--text-3); }

  .search-results { max-height: 340px; overflow-y: auto; margin-top: 6px; }
  .search-result-item {
    padding: 8px 10px; border-radius: var(--r-sm); cursor: pointer;
    transition: background .12s; border: 1px solid transparent;
  }
  .search-result-item:hover { background: var(--accent-soft); border-color: var(--accent-line); }
  .search-result-item .sr-teams { color: #fff; font-weight: 600; font-size: 12px; margin-bottom: 2px; }
  .search-result-item .sr-meta { color: var(--text-2); font-size: 10px; }
  .search-result-item .sr-score { color: var(--pos); font-weight: 600; }
  .search-result-item .sr-sport { color: var(--accent); font-weight: 600; }
  .search-no-results { color: var(--text-3); font-size: 11px; padding: 12px 10px; text-align: center; }

  .sb-nav { flex: 1; min-height: 0; overflow-y: auto; padding: 6px 10px 20px; }
  .sb-label {
    font-size: 10px; font-weight: 700; letter-spacing: .9px; text-transform: uppercase;
    color: var(--text-3); padding: 14px 8px 6px;
  }

  /* Level 1 — a top-level link (Home) or a sport-group header */
  .sb-item {
    display: flex; align-items: center; gap: 9px;
    padding: 7px 10px; border-radius: var(--r-sm);
    font-size: 13px; font-weight: 500; color: var(--text-2);
    cursor: pointer; user-select: none; transition: background .12s, color .12s;
  }
  .sb-item:hover { background: rgba(255,255,255,0.045); color: var(--text); }
  .sb-item.active { background: var(--accent-soft); color: #fff; font-weight: 600; }
  .sb-item .sb-ico { width: 16px; display: grid; place-items: center; flex-shrink: 0; color: var(--text-3); }
  .sb-item.active .sb-ico { color: var(--accent); }
  .sb-item .sb-txt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .sb-group { margin-bottom: 1px; }
  .sb-group-head {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 10px; border-radius: var(--r-sm);
    font-size: 12px; font-weight: 600; color: var(--text-2);
    cursor: pointer; user-select: none; transition: background .12s, color .12s;
  }
  .sb-group-head:hover { background: rgba(255,255,255,0.045); color: var(--text); }
  .sb-group.has-active .sb-group-head { color: var(--text); }
  .sb-chev {
    width: 12px; height: 12px; flex-shrink: 0; color: var(--text-3);
    transition: transform .18s ease;
  }
  .sb-group.open .sb-chev { transform: rotate(90deg); }
  .sb-group-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sb-group-n { font-size: 10px; color: var(--text-3); font-variant-numeric: tabular-nums; }

  .sb-group-body { display: none; padding: 2px 0 4px 10px; margin-left: 10px; border-left: 1px solid var(--line-soft); }
  .sb-group.open .sb-group-body { display: block; }

  /* Level 2 — a league */
  .sb-league {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 9px; border-radius: var(--r-sm);
    font-size: 12.5px; color: var(--text-2); cursor: pointer; user-select: none;
    transition: background .12s, color .12s;
  }
  .sb-league:hover { background: rgba(255,255,255,0.05); color: var(--text); }
  .sb-league.active { background: var(--accent-soft); color: #fff; font-weight: 600; box-shadow: inset 2px 0 0 var(--accent); }
  .sb-league .sb-txt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sb-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--pos); flex-shrink: 0; box-shadow: 0 0 6px rgba(61,220,151,0.6); }
  .sb-dot.off { background: var(--line); box-shadow: none; }

  /* Level 3 — tournaments inside the active league */
  .sb-tourns { padding: 3px 0 5px 12px; margin: 2px 0 4px 8px; border-left: 1px solid var(--line-soft); }
  .sb-tourn {
    display: block; padding: 5px 9px; border-radius: var(--r-sm);
    font-size: 12px; color: var(--text-3); cursor: pointer; user-select: none;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    transition: background .12s, color .12s;
  }
  .sb-tourn:hover { background: rgba(255,255,255,0.05); color: var(--text-2); }
  .sb-tourn.active { color: var(--accent-2); background: var(--accent-soft); font-weight: 600; }
  .sb-tourn-empty { font-size: 11px; color: var(--text-3); padding: 4px 9px; font-style: italic; }

  .sb-foot {
    flex-shrink: 0; padding: 10px 16px; border-top: 1px solid var(--line-soft);
    display: flex; align-items: center; gap: 8px; opacity: .65;
  }
  .sb-foot span { font-size: 9px; color: var(--text-3); text-transform: uppercase; letter-spacing: .5px; }
  .sb-foot img { height: 22px; border-radius: 4px; }

  /* ============================================================
     Topbar
     ============================================================ */
  .topbar {
    flex-shrink: 0; height: 58px; display: flex; align-items: center; gap: 14px;
    padding: 0 20px 0 24px;
    background: rgba(13,18,32,0.86);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
    position: relative; z-index: 20;
  }
  .crumbs { display: flex; align-items: center; gap: 7px; min-width: 0; flex: 1; font-size: 13px; }
  .crumb {
    color: var(--text-2); cursor: pointer; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; transition: color .12s;
  }
  .crumb:hover { color: var(--accent-2); }
  .crumb.current { color: #fff; font-weight: 600; cursor: default; }
  .crumb.current:hover { color: #fff; }
  .crumb-sep { color: var(--text-3); flex-shrink: 0; font-size: 11px; }

  .topbar-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

  .btn {
    display: inline-flex; align-items: center; gap: 7px;
    background: var(--surface-2); border: 1px solid var(--line);
    border-radius: var(--r-md); color: var(--text-2);
    font-size: 12.5px; font-weight: 500; padding: 7px 12px;
    cursor: pointer; user-select: none; transition: all .15s; white-space: nowrap;
  }
  .btn:hover { border-color: var(--accent-line); color: var(--text); background: var(--surface-3); }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.ghost { background: transparent; border-color: transparent; }
  .btn.ghost:hover { background: var(--surface-2); }
  .btn-count {
    font-size: 10px; font-weight: 700; padding: 1px 7px; border-radius: var(--r-pill);
    background: var(--neg); color: #fff; font-variant-numeric: tabular-nums;
  }
  .btn-count.zero { background: var(--line); color: var(--text-3); }

  /* Period picker */
  .period {
    display: flex; align-items: center; background: var(--surface-2);
    border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden;
  }
  .period select {
    background: transparent; border: 0; color: var(--text);
    font-size: 12.5px; padding: 7px 8px; outline: none; cursor: pointer;
  }
  .period select:hover { color: var(--accent-2); }
  .period select option { background: var(--surface-2); color: var(--text); }
  .period .period-div { width: 1px; align-self: stretch; background: var(--line); }

  .icon-btn {
    width: 34px; height: 34px; display: grid; place-items: center;
    background: transparent; border: 1px solid transparent; border-radius: var(--r-md);
    color: var(--text-2); cursor: pointer; transition: all .15s; flex-shrink: 0;
  }
  .icon-btn:hover { background: var(--surface-2); color: var(--text); border-color: var(--line); }
  .sb-toggle { display: none; }

  /* Legacy form controls (still used inside a couple of panels) */
  .dropdown-group { display: flex; flex-direction: column; gap: 4px; min-width: 120px; }
  .dropdown-label { font-size: 9px; text-transform: uppercase; letter-spacing: .8px; color: var(--text-2); font-weight: 600; }
  .dropdown-select {
    background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-sm);
    padding: 6px 10px; font-size: 13px; color: var(--text); outline: none; cursor: pointer;
  }
  .dropdown-select:focus { border-color: var(--accent); }

  /* ============================================================
     Home view
     ============================================================ */
  .home-hero { padding: 18px 0 24px; }
  .home-hero h2 { font-size: 30px; font-weight: 700; color: #fff; letter-spacing: -0.6px; }
  .home-hero h2 b { color: var(--accent); }
  .home-hero p { color: var(--text-2); font-size: 14px; margin-top: 8px; max-width: 620px; }

  .home-section-title {
    font-size: 10px; font-weight: 700; color: var(--text-3); text-transform: uppercase;
    letter-spacing: .9px; margin: 22px 0 12px; display: flex; align-items: center; gap: 10px;
  }
  .home-section-title::after { content: ''; flex: 1; height: 1px; background: var(--line-soft); }

  .home-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(232px, 1fr)); gap: 12px; }
  .home-tile {
    display: flex; flex-direction: column; gap: 10px;
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg);
    padding: 15px; text-decoration: none; color: inherit; cursor: pointer;
    transition: transform .18s, border-color .18s, box-shadow .18s;
    position: relative; overflow: hidden;
  }
  .home-tile::before {
    content: ''; position: absolute; inset: 0 0 auto 0; height: 2px;
    background: linear-gradient(90deg, var(--accent), transparent);
    opacity: 0; transition: opacity .18s;
  }
  .home-tile:hover { transform: translateY(-2px); border-color: var(--accent-line); box-shadow: var(--shadow-sm); }
  .home-tile:hover::before { opacity: 1; }
  .home-tile.off { opacity: .62; }
  .home-tile.off:hover { opacity: 1; }
  .ht-head { display: flex; align-items: center; gap: 10px; }
  .ht-icon { width: 28px; height: 28px; border-radius: 7px; object-fit: cover; flex-shrink: 0; }
  .ht-name { flex: 1; font-size: 14px; font-weight: 700; color: #fff; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ht-status {
    font-size: 9px; font-weight: 700; padding: 2px 8px; border-radius: var(--r-pill);
    text-transform: uppercase; letter-spacing: .5px; line-height: 1.5; flex-shrink: 0;
    border: 1px solid transparent;
  }
  .ht-status.active  { background: rgba(61,220,151,0.14); color: var(--pos); border-color: rgba(61,220,151,0.34); }
  .ht-status.off     { background: rgba(255,255,255,0.04); color: var(--text-2); border-color: var(--line); }
  .ht-status.unknown { background: var(--accent-soft); color: var(--text-2); border-color: var(--line-soft); }
  .ht-range { color: var(--text-2); font-size: 12.5px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .ht-foot { color: var(--text-3); font-size: 11px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; min-height: 14px; }
  .ht-season { color: var(--accent); font-weight: 600; }
  .ht-foot .ht-season + .ht-months::before { content: '· '; color: var(--line); }

  /* Icon fallback badge */
  .sport-init {
    display: inline-flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, var(--surface-3), var(--line));
    color: #fff; font-weight: 700; border-radius: 6px;
    line-height: 1; flex-shrink: 0; user-select: none; font-size: 11px;
  }

  /* ============================================================
     Match list
     ============================================================ */
  .list-head {
    display: flex; align-items: baseline; gap: 12px; margin-bottom: 16px; flex-wrap: wrap;
  }
  .list-head h2 { font-size: 20px; font-weight: 700; color: #fff; letter-spacing: -0.3px; }
  .list-head .lh-sub { font-size: 12.5px; color: var(--text-2); }
  .list-head .lh-sub b { color: var(--text); font-variant-numeric: tabular-nums; }

  .day-head {
    display: flex; align-items: center; gap: 10px;
    font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .8px;
    color: var(--text-3); margin: 20px 0 10px;
  }
  .day-head:first-child { margin-top: 0; }
  .day-head::after { content: ''; flex: 1; height: 1px; background: var(--line-soft); }
  .day-head .dh-n { color: var(--text-3); font-weight: 600; letter-spacing: 0; }

  .match-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; }
  .match-card {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md);
    padding: 12px 14px; cursor: pointer; display: flex; flex-direction: column; gap: 7px;
    transition: transform .16s, border-color .16s, box-shadow .16s;
    position: relative; overflow: hidden;
  }
  .match-card::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 2px;
    background: var(--accent); opacity: 0; transition: opacity .16s;
  }
  .match-card:hover { border-color: var(--accent-line); transform: translateY(-1px); box-shadow: var(--shadow-sm); }
  .match-card:hover::before { opacity: 1; }

  .match-card .mc-top { display: flex; align-items: center; gap: 8px; }
  .match-card .mc-tournament {
    font-size: 10px; color: var(--text-3); text-transform: uppercase; letter-spacing: .6px;
    font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .match-card .mc-teams { font-size: 14px; font-weight: 700; color: #fff; line-height: 1.3; }
  .match-card .mc-teams .vs-sep { color: var(--text-3); font-weight: 500; font-size: 12px; }

  .match-card .mc-status {
    font-size: 9px; padding: 3px 8px; border-radius: var(--r-pill); font-weight: 700;
    text-transform: uppercase; letter-spacing: .5px; line-height: 1;
    display: inline-flex; align-items: center; gap: 5px; flex-shrink: 0;
    border: 1px solid transparent;
  }
  .mc-status.upcoming { background: var(--accent-soft); color: var(--accent-2); border-color: var(--accent-line); }
  .mc-status.live     { background: rgba(61,220,151,0.16); color: var(--pos); border-color: rgba(61,220,151,0.42); }
  .mc-status.final    { background: rgba(255,255,255,0.04); color: var(--text-2); border-color: var(--line); }
  .mc-status .pulse-dot { display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: currentColor; animation: pulse 2s ease-in-out infinite; }
  .mc-status .final-dot { display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: currentColor; opacity: .8; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }

  .match-card .mc-meta { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .match-card .mc-score { font-size: 15px; font-weight: 800; color: var(--pos); font-variant-numeric: tabular-nums; line-height: 1; }
  .match-card .mc-when { font-size: 11.5px; color: var(--text-2); font-variant-numeric: tabular-nums; }
  .match-card .mc-trades { color: var(--accent); font-weight: 600; font-size: 10px; margin-left: auto; }

  .match-card .mc-markets { display: flex; flex-wrap: wrap; gap: 4px; }
  .mc-market-chip {
    font-size: 9.5px; padding: 2px 7px; border-radius: var(--r-sm);
    background: rgba(255,255,255,0.04); color: var(--text-2); border: 1px solid var(--line-soft);
    font-weight: 600; line-height: 1.5; white-space: nowrap;
  }
  .mc-market-chip.more { background: transparent; color: var(--text-3); }
  .mc-no-odds { display: flex; align-items: center; gap: 4px; font-size: 10px; color: var(--warn); }

  /* ============================================================
     Event detail
     ============================================================ */
  .detail-view { display: none; }
  .detail-view.active { display: block; }

  .detail-header {
    background: linear-gradient(135deg, var(--surface) 0%, var(--surface-2) 100%);
    border: 1px solid var(--line); border-radius: var(--r-lg);
    padding: 20px 22px; margin-bottom: 18px;
    display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
  }
  .dh-main { flex: 1; min-width: 260px; }
  .dh-eyebrow {
    font-size: 10px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase;
    color: var(--text-3); margin-bottom: 6px; display: flex; align-items: center; gap: 8px;
  }
  .dh-title { font-size: 24px; font-weight: 700; color: #fff; letter-spacing: -0.4px; line-height: 1.2; }
  .dh-title .vs-sep { color: var(--text-3); font-weight: 500; font-size: 18px; margin: 0 6px; }
  .dh-meta { font-size: 12.5px; color: var(--text-2); display: flex; gap: 14px; margin-top: 8px; flex-wrap: wrap; align-items: center; }
  .dh-scorebox {
    display: flex; flex-direction: column; align-items: flex-end; gap: 3px;
    padding-left: 20px; border-left: 1px solid var(--line-soft);
  }
  .dh-scorebox .dh-num { font-size: 30px; font-weight: 800; color: var(--pos); font-variant-numeric: tabular-nums; line-height: 1; letter-spacing: -1px; }
  .dh-scorebox .dh-cap { font-size: 9px; text-transform: uppercase; letter-spacing: .8px; color: var(--text-3); font-weight: 700; }

  /* Market tabs */
  .mkt-tabs {
    display: flex; gap: 4px; overflow-x: auto; padding-bottom: 2px;
    border-bottom: 1px solid var(--line); margin-bottom: 18px;
    scrollbar-width: thin;
  }
  .mkt-tabs::-webkit-scrollbar { height: 3px; }
  .mkt-tab {
    display: inline-flex; align-items: center; gap: 7px; flex-shrink: 0;
    background: transparent; border: 0; border-bottom: 2px solid transparent;
    padding: 9px 14px; margin-bottom: -1px;
    font-size: 13px; font-weight: 600; color: var(--text-2);
    cursor: pointer; user-select: none; transition: color .14s, border-color .14s;
    white-space: nowrap; border-radius: var(--r-sm) var(--r-sm) 0 0;
  }
  .mkt-tab:hover { color: var(--text); background: rgba(255,255,255,0.03); }
  .mkt-tab.active { color: #fff; border-bottom-color: var(--accent); }
  .mkt-tab .mt-n {
    font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: var(--r-pill);
    background: rgba(255,255,255,0.06); color: var(--text-3); font-variant-numeric: tabular-nums;
  }
  .mkt-tab.active .mt-n { background: var(--accent-soft); color: var(--accent-2); }

  /* Legacy group heading (kept for any non-tabbed render path) */
  .market-group { margin-bottom: 24px; }
  .market-group-title {
    font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;
    color: var(--warn); margin-bottom: 8px; padding-left: 4px;
  }

  /* ============================================================
     Odds table
     ============================================================ */
  .table-wrapper {
    overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r-md);
    background: var(--surface);
  }
  .odds-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .odds-table th {
    text-align: left; padding: 9px 12px; font-size: 10px; text-transform: uppercase;
    letter-spacing: .7px; color: var(--text-3); font-weight: 700;
    border-bottom: 1px solid var(--line);
    background: var(--surface-2); position: sticky; top: 0; z-index: 1; cursor: pointer;
    user-select: none; white-space: nowrap;
  }
  .odds-table th:hover { color: var(--accent-2); }
  .odds-table th .sort-arrow { font-size: 9px; margin-left: 3px; color: var(--accent); }
  .odds-table td {
    padding: 7px 12px; border-bottom: 1px solid var(--line-soft); white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .odds-table tbody tr:last-child td { border-bottom: 0; }
  .odds-table tr:hover td { background: rgba(91,157,255,0.04); }
  .odds-table .question-cell {
    color: #fff; font-weight: 600; max-width: 240px; overflow: hidden; text-overflow: ellipsis;
    border-right: 1px solid var(--line-soft); background: rgba(255,255,255,0.012);
  }
  .odds-table .outcome-cell { color: var(--text); max-width: 220px; white-space: nowrap; overflow: hidden; }
  .odds-table .outcome-cell .oc-name { overflow: hidden; text-overflow: ellipsis; display: inline-block; max-width: calc(100% - 44px); vertical-align: bottom; }
  .odds-table .outcome-cell .oc-name.oc-name-solo { max-width: 100%; }
  .odds-table .outcome-cell .oc-line { white-space: nowrap; font-weight: 700; color: var(--text-2); }
  .odds-table .odds-val { font-weight: 500; color: var(--text); }
  .odds-table .null-val { color: var(--text-3); }
  .odds-table .best-odds { color: var(--pos); font-weight: 700; }
  .odds-table .highlight-red { background: rgba(255,111,111,0.13); color: var(--neg); font-weight: 700; }
  .odds-table .prob-cell { color: var(--violet); }
  .odds-table .group-row td { border-bottom: 1px solid var(--line); }

  .back-btn {
    background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-md);
    color: var(--text-2); font-size: 12.5px; padding: 7px 13px; cursor: pointer;
    transition: all .15s; display: inline-flex; align-items: center; gap: 6px;
  }
  .back-btn:hover { color: var(--text); border-color: var(--accent-line); background: var(--surface-3); }

  /* ============================================================
     Discrepancy drawer
     ============================================================ */
  /* Hidden scrims must not paint: a full-screen backdrop-filter is composited
     even at opacity 0, which costs a frame on every repaint. */
  .disc-scrim {
    position: fixed; inset: 0; background: rgba(4,7,13,0.55);
    opacity: 0; visibility: hidden; pointer-events: none; z-index: 60;
    transition: opacity .2s, visibility .2s;
  }
  .disc-scrim.show { opacity: 1; visibility: visible; pointer-events: auto; backdrop-filter: blur(2px); }

  .disc-panel {
    position: fixed; top: 0; right: 0; bottom: 0; width: var(--disc-w); max-width: 92vw;
    background: var(--surface); border-left: 1px solid var(--line);
    box-shadow: var(--shadow-lg); z-index: 70;
    display: flex; flex-direction: column;
    transform: translateX(100%); transition: transform .24s cubic-bezier(.4,0,.2,1);
    overscroll-behavior: contain;
  }
  .disc-panel.open { transform: translateX(0); }

  .disc-head { padding: 16px 18px 12px; border-bottom: 1px solid var(--line); flex-shrink: 0; }
  .disc-head-top { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .disc-head h3 {
    font-size: 13px; font-weight: 700; color: #fff; text-transform: uppercase; letter-spacing: .8px;
    display: flex; align-items: center; gap: 8px; flex: 1;
  }
  .disc-head h3 svg { color: var(--warn); }
  .error-log-count {
    background: var(--neg); color: #fff; font-size: 10px; padding: 2px 8px;
    border-radius: var(--r-pill); font-weight: 700; font-variant-numeric: tabular-nums;
  }
  .disc-scope { font-size: 11px; color: var(--text-3); margin-bottom: 12px; }
  .disc-scope b { color: var(--text-2); }

  .disc-filters { display: flex; flex-direction: column; gap: 8px; }
  .disc-filter-row { display: flex; align-items: center; gap: 8px; }
  .disc-filter-label {
    font-size: 9px; text-transform: uppercase; letter-spacing: .6px;
    color: var(--text-3); font-weight: 700; min-width: 58px;
  }
  .disc-tabs, .disc-mode { display: flex; gap: 3px; background: var(--surface-2); padding: 3px; border-radius: var(--r-sm); }
  .disc-tab, .disc-mode-tab {
    background: transparent; border: 0; border-radius: 4px;
    padding: 4px 11px; cursor: pointer; font-size: 11px; font-weight: 600;
    color: var(--text-3); transition: all .14s; user-select: none;
  }
  .disc-tab:hover, .disc-mode-tab:hover { color: var(--text); }
  .disc-tab.active { background: rgba(255,111,111,0.16); color: var(--neg); }
  .disc-mode-tab.active { background: var(--accent-soft); color: var(--accent-2); }

  /* The panel is fixed, but its list runs to thousands of pixels. Without this,
     scrolling past the last finding chains into the page behind, and the board
     slides around under a cursor that is sitting on the drawer — which reads as
     the panel not being pinned at all. */
  .error-log-list { overflow-y: auto; overscroll-behavior: contain; flex: 1; padding: 12px 14px 20px; }
  .error-log-item {
    background: var(--surface-2); border: 1px solid var(--line-soft);
    border-left: 2px solid var(--neg);
    border-radius: var(--r-sm); padding: 10px 12px; margin-bottom: 7px; cursor: pointer;
    transition: all .14s; font-size: 11.5px; line-height: 1.55;
  }
  .error-log-item:hover { border-color: var(--line); border-left-color: var(--neg); background: var(--surface-3); }
  .error-log-item .eli-event { color: #fff; font-weight: 600; font-size: 12.5px; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .error-log-item .eli-detail { color: var(--text-2); }
  .error-log-item .eli-detail b { color: var(--text); font-variant-numeric: tabular-nums; }
  .error-log-item .eli-range { color: var(--neg); font-weight: 700; font-variant-numeric: tabular-nums; }
  .error-log-item .eli-market {
    color: var(--accent-2); font-weight: 600; font-size: 10px; text-transform: uppercase; letter-spacing: .4px;
  }
  .error-log-empty { color: var(--text-3); font-size: 12px; text-align: center; padding: 40px 12px; }

  /* ============================================================
     Loading / states
     ============================================================ */
  .loading { text-align: center; padding: 60px; color: var(--text-2); }
  .spinner { width: 34px; height: 34px; border: 3px solid var(--line-soft); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 12px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  @keyframes shimmer { 0% { background-position: -500px 0; } 100% { background-position: 500px 0; } }
  .skeleton {
    background: linear-gradient(90deg, var(--surface) 25%, var(--surface-2) 50%, var(--surface) 75%);
    background-size: 1000px 100%; animation: shimmer 1.4s infinite linear; border-radius: var(--r-md);
  }
  /* A skeleton is the shape of the thing arriving, at the size it will arrive.
     So the placeholders below reuse the real frames (.match-card, .detail-header,
     .tp-item, .error-log-item …) and only swap the text for bars — nothing
     resizes or reflows at the moment data lands. */
  .skel-bar { border-radius: 4px; flex-shrink: 0; }

  /* Match card — same frame, padding and row rhythm as .match-card */
  .skel-card {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md);
    padding: 12px 14px; display: flex; flex-direction: column; gap: 7px;
  }
  .skel-card .skel-row { display: flex; align-items: center; gap: 8px; }
  .skel-card .skel-chips { display: flex; gap: 4px; }

  /* Detail header — matches .detail-header's frame so the swap is invisible */
  .skel-detail-header {
    background: linear-gradient(135deg, var(--surface) 0%, var(--surface-2) 100%);
    border: 1px solid var(--line); border-radius: var(--r-lg);
    padding: 20px 22px; margin-bottom: 18px;
    display: flex; align-items: center; gap: 20px;
  }
  .skel-detail-header .sdh-main { flex: 1; display: flex; flex-direction: column; gap: 9px; }
  .skel-detail-header .sdh-meta { display: flex; gap: 14px; }

  /* Market tab strip — same height and underline as .mkt-tabs */
  .skel-mkt-tabs {
    display: flex; gap: 4px; border-bottom: 1px solid var(--line);
    margin-bottom: 18px; padding: 9px 0 10px;
  }
  .skel-mkt-tabs .skel-bar { margin: 0 10px; }

  /* Odds table — real wrapper, a header band, then rows on the same 7px rhythm */
  .skel-table-wrap {
    border: 1px solid var(--line); border-radius: var(--r-md);
    background: var(--surface); overflow: hidden;
  }
  .skel-thead {
    display: flex; gap: 24px; padding: 9px 12px;
    background: var(--surface-2); border-bottom: 1px solid var(--line);
  }
  .skel-trow {
    display: flex; gap: 24px; padding: 7px 12px; border-bottom: 1px solid var(--line-soft);
  }
  .skel-trow:last-child { border-bottom: 0; }

  /* Sidebar tournament rows while the sport's list is being enumerated */
  .skel-tourn { padding: 5px 9px; }

  .skel-line { height: 14px; border-radius: 4px; margin-bottom: 8px; }
  .skel-line.w60 { width: 60%; } .skel-line.w40 { width: 40%; } .skel-line.w80 { width: 80%; }
  .section-header { font-size: 16px; margin-bottom: 14px; color: #fff; display: flex; align-items: center; gap: 8px; }

  .notice {
    background: rgba(255,192,67,0.07); border: 1px solid rgba(255,192,67,0.22);
    border-radius: var(--r-md); padding: 14px 18px; font-size: 13px; color: var(--warn);
  }
  .empty-state { text-align: center; padding: 70px 20px; color: var(--text-3); }
  .empty-state .es-icon { font-size: 30px; opacity: .5; margin-bottom: 10px; }
  .empty-state .es-title { font-size: 15px; font-weight: 600; color: var(--text-2); margin-bottom: 4px; }
  .empty-state .es-sub { font-size: 12.5px; }

  /* ============================================================
     Responsive
     ============================================================ */
  @media (max-width: 1080px) {
    .sidebar {
      position: fixed; left: 0; top: 0; bottom: 0;
      transform: translateX(-100%); transition: transform .24s cubic-bezier(.4,0,.2,1);
      box-shadow: var(--shadow-lg);
    }
    .sidebar.open { transform: translateX(0); }
    .sb-toggle { display: grid; }
    .content { padding: 18px 16px 50px; }
    .topbar { padding: 0 12px; }
  }
  @media (max-width: 640px) {
    .period select { max-width: 78px; }
    .home-hero h2 { font-size: 24px; }
    .dh-title { font-size: 19px; }
  }

  /* ============================================================
     Sport glyph badges
     ============================================================ */
  .sport-glyph {
    display: inline-grid; place-items: center; flex-shrink: 0; border-radius: 7px;
    color: var(--tint);
    background: color-mix(in srgb, var(--tint) 13%, transparent);
    border: 1px solid color-mix(in srgb, var(--tint) 26%, transparent);
  }
  .sport-glyph svg { width: 64%; height: 64%; }
  .sb-league-icon { width: 20px; height: 20px; border-radius: 6px; }
  .ht-icon.sport-glyph { width: 30px; height: 30px; border-radius: 8px; }
  .dh-ico { width: 18px; height: 18px; border-radius: 5px; }

  /* Sidebar group head now carries chevron + glyph + name + count + freshness */
  .sb-chev {
    display: grid; place-items: center; width: 16px; height: 16px; margin: -2px;
    padding: 2px; border-radius: 4px;
  }
  .sb-chev:hover { background: rgba(255,255,255,0.08); color: var(--text); }
  .sb-tourn.muted { opacity: .45; cursor: default; }
  .sb-tourn.muted:hover { background: transparent; color: var(--text-3); }
  /* Tournaments the sport runs, but not in the month on screen — still one click away. */
  .sb-tourn.dim { color: #4a5772; }
  .sb-tourn.dim:hover { color: var(--text-2); }
  .sb-tourn.dim.active { color: var(--accent-2); }

  .sb-tourn-wrap { padding: 3px 0 5px 12px; margin: 2px 0 4px 8px; border-left: 1px solid var(--line-soft); }
  .sb-tourn-wrap .sb-tourns { padding: 0; margin: 0; border: 0; max-height: 340px; overflow-y: auto; }
  .sb-tourn-filter {
    width: calc(100% - 9px); margin: 2px 0 5px; background: var(--surface-2);
    border: 1px solid var(--line); border-radius: var(--r-sm);
    padding: 5px 8px; font-size: 11.5px; color: var(--text); outline: none;
  }
  .sb-tourn-filter:focus { border-color: var(--accent-line); }
  .sb-tourn-filter::placeholder { color: var(--text-3); }
  .sb-tourn-sect {
    font-size: 9px; font-weight: 700; letter-spacing: .7px; text-transform: uppercase;
    color: var(--text-3); padding: 8px 9px 4px; display: flex; gap: 6px;
  }
  .sb-tourn-sect span { opacity: .7; font-weight: 600; letter-spacing: 0; }

  /* ============================================================
     Tournament picker (shown when a month is too big to load whole)
     ============================================================ */
  .tp-wrap {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg);
    padding: 20px; margin-top: 4px;
  }
  .tp-head { margin-bottom: 14px; }
  .tp-title { font-size: 15px; font-weight: 700; color: #fff; margin-bottom: 4px; }
  .tp-sub { font-size: 12.5px; color: var(--text-2); }
  .tp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 8px; }
  .tp-item {
    display: flex; align-items: center; gap: 10px;
    background: var(--surface-2); border: 1px solid var(--line-soft); border-radius: var(--r-md);
    padding: 10px 13px; cursor: pointer; transition: all .15s;
  }
  .tp-item:hover { border-color: var(--accent-line); background: var(--surface-3); transform: translateY(-1px); }
  .tp-name { flex: 1; min-width: 0; font-size: 13px; font-weight: 600; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tp-n { font-size: 11px; color: var(--text-3); font-variant-numeric: tabular-nums; flex-shrink: 0; }

  /* ============================================================
     Detail extras
     ============================================================ */
  .detail-top { margin-bottom: 14px; }
  .dh-pill {
    font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px;
    padding: 3px 9px; border-radius: var(--r-pill); border: 1px solid transparent; line-height: 1.5;
  }
  .dh-pill.upcoming { background: var(--accent-soft); color: var(--accent-2); border-color: var(--accent-line); }
  .dh-pill.live { background: rgba(61,220,151,0.16); color: var(--pos); border-color: rgba(61,220,151,0.42); }
  .dh-pill.final { background: rgba(255,255,255,0.04); color: var(--text-2); border-color: var(--line); }
  .dh-eyebrow { display: flex; align-items: center; gap: 8px; }

  .load-msg { font-size: 12px; color: var(--text-3); margin: -4px 0 14px; font-variant-numeric: tabular-nums; }
  .btn-lbl { }

  @media (max-width: 860px) {
    .btn-lbl { display: none; }
  }

  /* ============================================================
     Collapsed rail
     ------------------------------------------------------------
     Only above the overlay breakpoint: under it the sidebar already
     slides in and out, so a rail would be a second, conflicting mode.
     ============================================================ */
  @media (min-width: 1081px) {
    .sidebar { transition: width .18s ease; }
    .sidebar.collapsed { width: 62px; }

    .sidebar.collapsed .sb-head { flex-direction: column; gap: 10px; padding: 14px 8px; }
    .sidebar.collapsed .sb-brand { flex: none; justify-content: center; }
    .sidebar.collapsed .sb-brand-text { display: none; }
    .sidebar.collapsed .sb-collapse svg { transform: rotate(180deg); }

    .sidebar.collapsed .sb-search { display: none; }
    .sidebar.collapsed .sb-search-mini { display: grid; }

    .sidebar.collapsed .sb-nav { padding: 6px 8px 20px; overflow-x: hidden; }
    .sidebar.collapsed .sb-label { display: none; }
    .sidebar.collapsed .sb-item { justify-content: center; padding: 8px 0; }
    .sidebar.collapsed .sb-item .sb-txt { display: none; }

    /* Only the sport glyph survives — the tree needs width it no longer has. */
    .sidebar.collapsed .sb-group-head { justify-content: center; padding: 8px 0; gap: 0; }
    .sidebar.collapsed .sb-chev,
    .sidebar.collapsed .sb-group-name,
    .sidebar.collapsed .sb-group-n,
    .sidebar.collapsed .sb-dot { display: none; }
    .sidebar.collapsed .sb-group-body { display: none; }
    .sidebar.collapsed .sb-group.has-active .sb-group-head {
      background: var(--accent-soft); box-shadow: inset 2px 0 0 var(--accent);
    }

    .sidebar.collapsed .sb-foot { justify-content: center; padding: 10px 6px; }
    .sidebar.collapsed .sb-foot span { display: none; }
  }

  /* Bookmaker marks in the odds header. The mark replaces the name; the column's
     title attribute keeps the name reachable, and Fair columns stay labelled so
     the two halves of the table don't blur together. */
  .bk { display: inline-flex; align-items: center; gap: 6px; vertical-align: middle; }
  .bk-logo {
    width: 17px; height: 17px; border-radius: 4px; object-fit: contain;
    background: rgba(255,255,255,0.9); padding: 1px; flex-shrink: 0;
  }
  .bk-fair {
    font-size: 9px; font-weight: 700; letter-spacing: .5px; color: var(--violet);
    text-transform: uppercase;
  }
  .bk-name { font-size: 10px; }

  /* ============================================================
     Event page: pin everything down to the book row
     ------------------------------------------------------------
     The odds rows scroll inside the table rather than the page, so the back
     button, the fixture header, the market tabs and the header row of book
     marks all stay put while you read down a market.

     This has to be done by giving the table its own scroll box, not by making
     the block above it `position: sticky`. `.table-wrapper` carries
     `overflow-x: auto` for wide tables, and a non-visible overflow on one axis
     forces the other to `auto` — so a sticky `th` resolves against the wrapper,
     whose height is its content, and never sticks to anything.

     Only where there is height to spare: on a short viewport a fixed header
     plus tabs would leave no room for rows, so the page just scrolls normally.
     ============================================================ */
  @media (min-height: 560px) {
    .content.detail-mode { overflow: hidden; padding-bottom: 22px; }
    .content.detail-mode .content-inner { height: 100%; display: flex; flex-direction: column; min-height: 0; }
    .content.detail-mode .detail-view.active { flex: 1; display: flex; flex-direction: column; min-height: 0; }
    .content.detail-mode .detail-sticky { flex-shrink: 0; }
    .content.detail-mode #market-panel { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .content.detail-mode #market-panel .table-wrapper {
      flex: 1; min-height: 180px; overflow: auto;
    }
    /* Now that the wrapper scrolls in both axes, the header row has something
       to stick to. It sits above the best-price tint, hence the z-index. */
    .content.detail-mode .odds-table th { top: 0; z-index: 3; }
  }
</style>
</head>
<body>

<!-- ============ Sidebar: brand, search, sport/tournament tree ============ -->
<aside class="sidebar" id="sidebar">
  <div class="sb-head">
    <div class="sb-brand" onclick="goHome()" title="Home">
      <div class="sb-mark">OL</div>
      <div class="sb-brand-text"><b>Odds</b> Library</div>
    </div>
    <button class="sb-collapse" id="sb-collapse" onclick="toggleCollapse()" title="Collapse sidebar" aria-label="Collapse sidebar">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14.5 5.5 8 12l6.5 6.5"></path>
      </svg>
    </button>
  </div>

  <!-- Stands in for the search field once the rail is narrow: expands, then focuses it. -->
  <button class="sb-search-mini" onclick="expandAndSearch()" title="Search teams or players" aria-label="Search">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">

/* ---- Discrepancy config ---------------------------------------------------- */
const DISC_THRESHOLDS = { prob: [0.005, 0.01, 0.02], range: [0.05, 0.10, 0.15] };
let discThreshold = 0.10;

/* When a month holds more rows than this we load one tournament at a time
   instead of the whole sport — soccer alone can be 35k rows in a month. */
const MONTH_ROW_BUDGET = 6000;

/* ---- State ----------------------------------------------------------------- */
let activeSport = null;
let sportData = {};              // key -> { dateRange, tournaments, events, grouped, loadedScope }
let currentSlug = null;
let selectedTournament = null;   // tournament entry id (a URL slug)

let selectedMonth = null;
let detailByType = {}, detailTypes = [], activeMarketType = null, detailCfg = null;

/* ===========================================================================
   Data layer
   =========================================================================== */
const msg = (t) => { const e = document.getElementById('load-msg'); if (e) e.textContent = t; };

/* The database is shared with the scrapers, so a page request can come back 5xx
   under load. Retry those (and transport errors) with backoff rather than
   failing a whole month's load on one unlucky page. */
const RETRY_ATTEMPTS = 3;
const sleep = (ms) => new Promise(r => setTimeout(r, ms));

async function qOdds(table, params = '', range = null, extraHeaders = null) {
  const headers = { apikey: SB_KEY, Authorization: `Bearer ${SB_KEY}` };
  if (range) headers.Range = range;
  Object.assign(headers, extraHeaders || {});

  let lastErr = null;
  for (let attempt = 0; attempt < RETRY_ATTEMPTS; attempt++) {
    if (attempt) await sleep(400 * 2 ** (attempt - 1));
    try {
      const r = await fetch(`${SB_URL}/rest/v1/${table}?${params}`, { headers });
      if (r.ok || r.status === 206) {
        const text = await r.text();
        return text ? JSON.parse(text) : [];
      }
      lastErr = new Error(`API ${r.status}: ${table}`);
      if (r.status < 500 && r.status !== 429) throw lastErr;  // client error — retrying won't help
    } catch (err) {
      lastErr = err;
      if (/^API [45]\d\d/.test(err.message) && !/API (5\d\d|429)/.test(err.message)) throw err;
    }
  }
  throw lastErr;
}

// Exact row count for a filter, read off the Content-Range header.
async function countOdds(table, params) {
  const headers = {
    apikey: SB_KEY, Authorization: `Bearer ${SB_KEY}`,
    Range: '0-0', Prefer: 'count=exact',
  };
  const r = await fetch(`${SB_URL}/rest/v1/${table}?${params}`, { headers });
  if (!r.ok && r.status !== 206) throw new Error(`API ${r.status}: ${table}`);
  const cr = r.headers.get('content-range') || '';
  const n = parseInt(cr.split('/')[1], 10);
  return isNaN(n) ? 0 : n;
}

/* Page through a filtered set in parallel. PostgREST caps a response at 1000
   rows, so a month of soccer is ~36 requests — sequential paging made that a
   4-second wait. Knowing the count up front lets us fan the pages out instead.
   The sort matters twice over. It has to be stable, or offset paging repeats
   and drops rows; and it has to start with `date`, the filtered (indexed)
   column. Ordering by `id` alone forces a fresh sort of the whole month on
   every page, which under concurrency trips the Postgres statement timeout
   (57014). `date,id` is both index-friendly and unique. */
const PAGE = 1000;
const PAGE_CONCURRENCY = 5;

async function qAllOdds(table, params, total = null, onProgress = null) {
  const p = params.includes('order=') ? params : params + '&order=date.asc,id.asc';
  if (total == null) total = await countOdds(table, p);
  if (total === 0) return [];
  const pages = Math.ceil(total / PAGE);
  const out = new Array(pages);
  let next = 0, done = 0;

  async function worker() {
    while (true) {
      const i = next++;
      if (i >= pages) return;
      out[i] = await qOdds(table, p, `${i * PAGE}-${i * PAGE + PAGE - 1}`);
      done++;
      if (onProgress) onProgress(done, pages);
    }
  }
  await Promise.all(Array.from({ length: Math.min(PAGE_CONCURRENCY, pages) }, worker));
  return out.flat();
}

function monthBounds(year, month) {
  const start = `${year}-${String(month).padStart(2, '0')}-01`;
  const ny = month === 12 ? year + 1 : year;
  const nm = month === 12 ? 1 : month + 1;
  return [start, `${ny}-${String(nm).padStart(2, '0')}-01`];
}
function monthFilter(year, month) {
  const [a, b] = monthBounds(year, month);
  return `date=gte.${a}&date=lt.${b}`;
}

// Phase 1 — the span of dates a sport has, so the period picker knows its options.
async function loadDateRange(key) {
  const cfg = SPORTS[key];
  const [minRows, maxRows] = await Promise.all([
    qOdds(cfg.table, 'select=date&order=date.asc&limit=1'),
    qOdds(cfg.table, 'select=date&order=date.desc&limit=1'),
  ]);
  const min = minRows.length ? minRows[0].date : null;
  const max = maxRows.length ? maxRows[0].date : null;

  sportData[key] = sportData[key] || {};
  const range = { min, max, combos: [] };
  if (min && max) {
    let cur = new Date(min + 'T00:00:00Z');
    cur.setUTCDate(1);
    const end = new Date(max + 'T00:00:00Z');
    while (cur <= end) {
      range.combos.push({ year: cur.getUTCFullYear(), month: cur.getUTCMonth() + 1 });
      cur.setUTCMonth(cur.getUTCMonth() + 1);
    }
  }
  sportData[key].dateRange = range;
  return range;
}

/* Phase 2 — which tournaments ran this month, and how big each is. Scanning one
   column keeps the payload small even when the row count is large. */
/* ---------------------------------------------------------------------------
   Tournaments
   ---------------------------------------------------------------------------
   `tournament` is free text and has been written by more than one generation of
   the ingest, so one competition can appear under several names:

     sport_key            tournament labels
     aussierules_afl      "AFL", "Aussierules Afl"
     mma_ufc              "UFC",  "Mma Ufc"
     cricket_big_bash     "Big Bash", "Big Bash League"
     americanfootball_ncaaf  "NCAAF", "Ncaaf"

   Checking the dates shows these are renames, not parallel feeds — "Aussierules
   Afl" covers 2026-08-01→07 and "AFL" runs 2019→now — so they have to collapse
   into one entry or the sidebar lists the same league twice.

   `sport_key` is the reliable identity, with one exception: a few keys are
   buckets rather than leagues. `tennis_atp` carries hundreds of real event names
   ("ATP Wimbledon", "ATP Cincinnati") from before each got its own key, so
   collapsing on it would hide them all behind one row. Hence the rule below: a
   key with a handful of labels is a renamed competition and merges; a key with
   many is a bucket, and its labels stay listed individually. */
const MERGE_MAX_LABELS = 3;

// A label the ingest generated from the key itself ("Aussierules Afl" for
// `aussierules_afl`) — always the weaker name when a real one exists.
function isDerivedLabel(label, sportKey) {
  return slugify(label) === slugify(sportKey);
}

/* When every label for a key is generated ("Aussierules Aflw" is the only name
   `aussierules_aflw` has ever had), build a better one from the key itself:
   drop the leading sport token and shout the short ones, which is how these
   competitions are actually written — AFLW, WAFL, T20 Blast Women. */
function labelFromSportKey(sportKey) {
  const parts = String(sportKey || '').split('_').filter(Boolean);
  if (parts.length < 2) return null;
  return parts.slice(1)
    .map(w => w.length <= 4 ? w.toUpperCase() : w.charAt(0).toUpperCase() + w.slice(1))
    .join(' ');
}

/* Prefer a real name over a generated one, then the fullest, then the one that
   shouts (acronyms like NCAAF over Ncaaf). Deliberately independent of the month
   on screen: ranking by row count made a league read "Big Bash" in January and
   "Big Bash League" in August. */
const upperCount = (str) => (str.match(/[A-Z]/g) || []).length;

function pickLabel(labels, sportKey) {
  const real = labels.filter(l => !l.derived);
  if (!real.length) {
    const built = labelFromSportKey(sportKey);
    if (built) return built;
  }
  const pool = real.length ? real : labels;
  return pool.slice().sort((a, b) =>
    (b.label.length - a.label.length) ||
    (upperCount(b.label) - upperCount(a.label)) ||
    a.label.localeCompare(b.label)
  )[0].label;
}

/* Turn the (sport_key, label) pairs gathered so far into selectable entries.
   Runs after the month scan and again as the all-time walk streams names in. */
function rebuildTournamentIndex(key) {
  const d = sportData[key] || {};
  const monthCounts = d.monthPairs || new Map();          // "key\u0000label" -> rows this month
  const byKey = new Map();

  const note = (sportKey, label) => {
    const sk = sportKey || '';
    if (!byKey.has(sk)) byKey.set(sk, new Map());
    const m = byKey.get(sk);
    if (!m.has(label)) m.set(label, { label, derived: isDerivedLabel(label, sk) });
  };
  for (const pairKey of monthCounts.keys()) {
    const [sk, label] = pairKey.split('\u0000');
    note(sk, label);
  }
  for (const pair of (d.allPairs || [])) note(pair.sportKey, pair.label);

  const rowsOf = (sk, label) => monthCounts.get(`${sk}\u0000${label}`) || 0;
  const entries = [];
  for (const [sportKey, labelMap] of byKey) {
    const labels = [...labelMap.values()];
    if (labels.length <= MERGE_MAX_LABELS) {
      // One competition that has been renamed — select on the key.
      entries.push({
        sportKey,
        label: pickLabel(labels, sportKey),
        labels: labels.map(l => l.label),
        rows: labels.reduce((n, l) => n + rowsOf(sportKey, l.label), 0),
        filter: { col: 'sport_key', value: sportKey },
      });
    } else {
      // A bucket key — each label is its own event, so select on the label.
      for (const l of labels) {
        entries.push({
          sportKey,
          label: l.label,
          labels: [l.label],
          rows: rowsOf(sportKey, l.label),
          filter: { col: 'tournament', value: l.label },
        });
      }
    }
  }

  /* URL slugs have to be stable across months, or a bookmark breaks and changing
     period silently drops the selected tournament. So a merged entry is named
     after its sport_key (minus the sport prefix) rather than its label, which can
     move; a bucket entry is named after its label, which IS its identity there.
     Sorting first keeps collision suffixes deterministic. */
  entries.sort((a, b) => a.sportKey.localeCompare(b.sportKey) || a.label.localeCompare(b.label));
  const used = new Set();
  for (const e of entries) {
    const stem = e.filter.col === 'sport_key'
      ? (slugify(e.sportKey.split('_').slice(1).join('_')) || slugify(e.sportKey))
      : slugify(e.label);
    let id = stem || slugify(e.sportKey) || 'other';
    if (used.has(id)) {
      const alt = slugify(e.sportKey);
      id = used.has(alt) ? `${id}-${slugify(e.label)}` : alt;
    }
    used.add(id);
    e.id = id;
  }

  d.tournamentEntries = entries;
  d.tournaments = entries.filter(e => e.rows > 0).sort((a, b) => b.rows - a.rows || a.label.localeCompare(b.label));
  d.allTournaments = entries.slice().sort((a, b) => a.label.localeCompare(b.label));
  return d.tournaments;
}

function tournamentEntry(key, id) {
  return (sportData[key]?.tournamentEntries || []).find(e => e.id === id) || null;
}
function currentTournamentEntry() {
  return selectedTournament ? tournamentEntry(activeSport, selectedTournament) : null;
}
function currentTournamentLabel() {
  const e = currentTournamentEntry();
  return e ? e.label : null;
}

async function loadTournamentIndex(key, year, month) {
  const cfg = SPORTS[key];
  const d = (sportData[key] = sportData[key] || {});
  const stamp = `${year}-${month}`;
  if (d.tournamentsFor === stamp) return d.tournaments;

  const filter = monthFilter(year, month);
  const total = await countOdds(cfg.table, `select=id&${filter}`);
  msg(`Indexing ${cfg.label} — ${total.toLocaleString()} rows…`);
  // Both columns: the label is what to show, the key is what makes two labels
  // the same competition.
  const rows = total === 0 ? [] : await qAllOdds(cfg.table, `select=sport_key,tournament&${filter}`, total,
    (done, pages) => msg(`Indexing ${cfg.label} — ${Math.round(done / pages * 100)}%`));

  const pairs = new Map();
  for (const r of rows) {
    const k = `${r.sport_key || ''}\u0000${r.tournament || 'Other'}`;
    pairs.set(k, (pairs.get(k) || 0) + 1);
  }
  d.monthPairs = pairs;
  d.tournamentsFor = stamp;
  d.monthRows = total;
  rebuildTournamentIndex(key);
  return d.tournaments;
}

// Participants, coalesced across the shapes different sports use.
function participants(m) {
  const stripLine = (n) => {
    if (!n) return '';
    if (/^(over|under)\s/i.test(n)) return '';
    return n.replace(/\s+[+-]?\d+(\.\d+)?$/, '').trim();
  };
  const t1 = m.home_team || m.team1 || m.player1 || m.fighter1 || stripLine(m.oc1_name) || '';
  const t2 = m.away_team || m.team2 || m.player2 || m.fighter2 || stripLine(m.oc2_name) || '';
  return [t1, t2];
}
function eventSlug(key, m) {
  const [t1, t2] = participants(m);
  if (t1 && t2) return `${key}-${slugify(t1)}-${slugify(t2)}-${m.date}`;
  if (m.optic_fixture_id) return `${key}-${m.date}-${slugify(String(m.optic_fixture_id))}`;
  return `${key}-${m.date}-${slugify(m.commence_time || '')}`;
}

/* Phase 3 — the markets themselves, scoped to a month and (usually) one
   tournament. `scope` records what is currently in memory so a re-render knows
   whether it can answer from cache. */
async function loadMarkets(key, year, month, entry) {
  const cfg = SPORTS[key];
  const d = (sportData[key] = sportData[key] || {});
  const scope = `${year}-${month}|${entry ? entry.id : '*'}`;
  if (d.loadedScope === scope) return d;

  let filter = monthFilter(year, month);
  // A merged entry filters on sport_key so it picks up every name the league has
  // been given; a bucket entry filters on the label itself.
  if (entry) filter += `&${entry.filter.col}=eq.${encodeURIComponent(entry.filter.value)}`;

  const what = entry ? entry.label : cfg.label;
  msg(`Loading ${what}…`);
  const total = await countOdds(cfg.table, `select=id&${filter}`);
  const markets = await qAllOdds(cfg.table, `select=*&${filter}`, total,
    (done, pages) => msg(`Loading ${what} — ${Math.round(done / pages * 100)}%`));

  const grouped = {};
  const eventMap = new Map();
  for (const m of markets) {
    m.sports_market_type = MARKET_TYPE_MAP[m.sports_market_type] || m.sports_market_type;
    const [t1, t2] = participants(m);
    const slug = eventSlug(key, m);
    m.event_slug = slug;
    const pair = (t1 && t2) ? `${t1} vs ${t2}` : (t1 || t2 || slug);

    if (m.sports_market_type === 'totals') m.question = `${pair}: O/U ${m.line ?? ''}`.trim();
    else if (m.sports_market_type === 'spreads') m.question = `Spread: ${pair}${m.line != null ? ` (${m.line})` : ''}`;
    else m.question = pair;

    if (!grouped[slug]) grouped[slug] = [];
    const isDup = grouped[slug].some(p =>
      p.sports_market_type === m.sports_market_type &&
      p.oc1_name === m.oc1_name && p.oc2_name === m.oc2_name && p.line === m.line);
    if (!isDup) grouped[slug].push(m);

    const s1 = m.home_score ?? m.player1_score ?? m.team1_score ?? m.fighter1_score ?? null;
    const s2 = m.away_score ?? m.player2_score ?? m.team2_score ?? m.fighter2_score ?? null;
    const hasScore = s1 != null && s2 != null;

    if (!eventMap.has(slug)) {
      eventMap.set(slug, {
        slug, title: pair,
        start_time_utc: m.commence_time || `${m.date}T00:00:00Z`,
        date: m.date,
        score: hasScore ? `${s1}-${s2}` : null,
        ended: hasScore,
        live: false,
        tournament: canonicalTournamentLabel(key, m) || m.tournament || null,
        location: m.location || null,
      });
    } else {
      const ev = eventMap.get(slug);
      if (t1 && t2 && m.sports_market_type === 'moneyline') ev.title = pair;
      if (!ev.score && hasScore) { ev.score = `${s1}-${s2}`; ev.ended = true; }
    }
  }

  d.events = [...eventMap.values()].sort((a, b) => a.date.localeCompare(b.date));
  d.markets = markets;
  d.grouped = grouped;
  d.loadedScope = scope;
  return d;
}

/* ===========================================================================
   Utilities
   =========================================================================== */
function slugify(s) {
  return (s || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
}
function escHtml(s) {
  if (s == null) return '';
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function escAttr(s) {
  return escHtml(s).replace(/"/g, '&quot;');
}
// For a value dropped inside a single-quoted JS string inside a double-quoted attribute.
function jsStr(s) {
  return String(s == null ? '' : s)
    .replace(/\\/g, '\\\\').replace(/'/g, "\\'")
    .replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
}
const MONTH_LONG = ['', 'January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

function fmtDate(u) {
  if (!u) return 'TBD';
  const d = new Date(u);
  if (isNaN(d)) return 'TBD';
  return d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }) +
    ' · ' + d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
}
function fmtTime(u) {
  const d = new Date(u);
  if (isNaN(d)) return 'TBD';
  return d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
}
function dayKey(u) {
  const d = new Date(u);
  if (isNaN(d)) return 'tbd';
  return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
}
function dayLabel(u) {
  const d = new Date(u);
  if (isNaN(d)) return 'Date TBD';
  const now = new Date();
  const a = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const b = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const diff = Math.round((a - b) / 86400000);
  if (diff === 0) return 'Today';
  if (diff === 1) return 'Tomorrow';
  if (diff === -1) return 'Yesterday';
  return d.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });
}
// "A vs B" → styled two-part title.
function splitTitle(title) {
  const parts = String(title || '').split(/\s+vs\.?\s+/i);
  if (parts.length === 2) return `${escHtml(parts[0])} <span class="vs-sep">vs</span> ${escHtml(parts[1])}`;
  return escHtml(title);
}
function periodLabel() {
  return selectedYear && selectedMonth ? `${MONTH_LONG[selectedMonth]} ${selectedYear}` : '';
}

/* Market ordering: period bucket first (full match → 1st half → quarter → set →
   inning), then h2h → spread → total, then alphabetical. */
function marketSortKey(t) {
  const k = String(t || '').toLowerCase();
  let primary = 9, period = 0;
  if (k.startsWith('1h_') || k.startsWith('first_half_') || k.startsWith('1p_') || k.startsWith('first_period_')) period = 1;
  else if (k.startsWith('1q_') || k.startsWith('first_quarter_')) period = 2;
  else if (k.startsWith('1s_') || k.startsWith('first_set_')) period = 3;
  else if (k.startsWith('1inn_') || k.startsWith('first_inning_')) period = 4;
  if (k === 'h2h' || k === 'moneyline' || k.endsWith('_h2h') || k.endsWith('_moneyline')) primary = 0;
  else if (k === 'spread' || k === 'spreads' || k.endsWith('_spread') || k.endsWith('_spreads')) primary = 1;
  else if (k === 'total' || k === 'totals' || k.endsWith('_total') || k.endsWith('_totals') ||
           k === 'total_games' || k === 'total_sets' || k.endsWith('_total_games') || k.endsWith('_total_sets')) primary = 2;
  return [primary, period, k];
}
function compareMarkets(a, b) {
  const A = marketSortKey(a), B = marketSortKey(b);
  return A[1] - B[1] || A[0] - B[0] || A[2].localeCompare(B[2]);
}
function formatMarketType(t) {
  if (!t) return '';
  const k = String(t).toLowerCase();
  if (HOCKEY_SPORTS.has(activeSport) && HOCKEY_PERIOD_NAMES[k]) return HOCKEY_PERIOD_NAMES[k];
  if (MARKET_NAMES[k]) return MARKET_NAMES[k];
  return k.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
}

function marketHasAnyPrice(m) {
  for (const b of ODDS_BOOKS) {
    if (m[b.col1] != null || m[b.col2] != null || m[b.col3] != null) return true;
  }
  return false;
}
function getEventMarkets(grouped, slug) { return grouped[slug] || []; }
function evHasMarkets(ev, grouped) { return getEventMarkets(grouped, ev.slug).length > 0; }

function inSeasonByCalendar(key) {
  const r = SEASON_RANGES[key];
  if (!r) return null;
  if (r.yearRound) return true;
  return r.months.includes(new Date().getMonth() + 1);
}
function seasonLabel(key) { return SEASON_RANGES[key]?.label || null; }

const ACTIVE_WINDOW_DAYS = 14;
function recentCutoff() {
  return new Date(Date.now() - ACTIVE_WINDOW_DAYS * 86400000).toISOString().slice(0, 10);
}

function applySidebarCollapsed() {

function toggleCollapse(force) {

  applySidebarCollapsed();
  try { localStorage.setItem(SIDEBAR_COLLAPSE_KEY, sidebarCollapsed ? '1' : '0'); } catch { /* private mode */ }
}

function toggleNavGroup(key, ev) {

/* Every tournament the sport has ever run, not just the ones in the selected
   month. The month index still leads the list — those are the ones with data in
   front of you — but the rest stay reachable, dimmed, and one click away.

   The all-time list comes from a keyset walk over distinct `tournament` values
   (one request per distinct name). That is ~1s for most sports but ~60s for
   soccer's 222 and tennis's 294, so it renders progressively as names arrive and
   is cached in localStorage afterwards. */
const TOURNAMENT_CACHE_TTL = 7 * 86400000;
const TOURNAMENT_CACHE_VERSION = 'v2';   // v1 stored bare labels, with no key to merge on
const TOURNAMENT_SCAN_CAP = 600;
let navFilter = '';

function tournamentCacheKey(key) { return `ol.tourns.${TOURNAMENT_CACHE_VERSION}.${key}`; }

function readTournamentCache(key) {
  try {
    const o = JSON.parse(localStorage.getItem(tournamentCacheKey(key)) || 'null');
    if (!o || !Array.isArray(o.pairs)) return null;
    if (Date.now() - o.at > TOURNAMENT_CACHE_TTL) return null;
    return o.pairs;
  } catch { return null; }
}
function writeTournamentCache(key, pairs) {
  try {
    localStorage.setItem(tournamentCacheKey(key), JSON.stringify({ at: Date.now(), pairs }));
  } catch { /* private mode / quota — the list still works, just uncached */ }
}

async function loadAllTournaments(key) {
  const d = (sportData[key] = sportData[key] || {});
  if (d.tournamentScan === 'running') return d.allPairs || [];   // already walking
  if (d.allPairs && d.tournamentScan === 'done') return d.allPairs;

  const cached = readTournamentCache(key);
  if (cached) {
    d.allPairs = cached;
    d.tournamentScan = 'done';
    rebuildTournamentIndex(key);
    refreshNavTournaments(key);
    return cached;
  }

  const cfg = SPORTS[key];
  const pairs = [];
  let last = null;
  d.tournamentScan = 'running';
  refreshNavTournaments(key);

  try {
    for (let i = 0; i < TOURNAMENT_SCAN_CAP; i++) {
      if (activeSport !== key) { d.tournamentScan = 'aborted'; return pairs; }  // moved on
      // sport_key rides along free of charge, and it is what lets two spellings
      // of one league collapse into a single row.
      let params = 'select=tournament,sport_key&order=tournament.asc&limit=1';
      if (last != null) params += `&tournament=gt.${encodeURIComponent(last)}`;
      const rows = await qOdds(cfg.table, params);
      // NULL tournaments sort last, so a null means the walk is finished.
      if (!rows.length || rows[0].tournament == null) break;
      last = rows[0].tournament;
      pairs.push({ label: last, sportKey: rows[0].sport_key || '' });
      d.allPairs = pairs.slice();
      if (pairs.length % 8 === 0) { rebuildTournamentIndex(key); refreshNavTournaments(key); }
    }
    d.tournamentScan = 'done';
    writeTournamentCache(key, pairs);
  } catch (err) {
    d.tournamentScan = 'failed';
    console.error('tournament scan', err);
  }
  d.allPairs = pairs;
  rebuildTournamentIndex(key);
  refreshNavTournaments(key);
  return pairs;
}

// Swap just the rows, never the whole sidebar: the filter box sits outside this
// container so typing survives the progressive updates during a scan.
function refreshNavTournaments(key) {
  if (key !== activeSport) return;
  const el = document.getElementById('sb-tourns');
  if (!el) return;
  el.innerHTML = navTournamentRows(key);

  // A scan can push the list past the point where a filter earns its place;
  // add or drop the box to match, but never yank it while it's being typed in.
  const wrap = el.parentElement;
  const input = wrap.querySelector('.sb-tourn-filter');
  const needed = navTournamentCount(key) > 14;
  if (needed && !input) {
    el.insertAdjacentHTML('beforebegin', navFilterHtml());
  } else if (!needed && input && document.activeElement !== input) {
    input.remove();
  }
  applyNavFilter();
}

function navTournamentCount(key) {
  const d = sportData[key] || {};
  return (d.allTournaments || []).length + (d.tournaments || []).length;
}
function navFilterHtml() {
  return `<input class="sb-tourn-filter" type="text" placeholder="Filter tournaments…" value="${escAttr(navFilter)}"
    oninput="navFilter=this.value; applyNavFilter()" autocomplete="off">`;
}

function navTournamentRows(key) {
  const d = sportData[key] || {};
  const inMonth = d.tournaments || [];
  const all = d.allTournaments || [];
  const scanning = d.tournamentScan === 'running';
  const canLoadAll = (d.monthRows || 0) <= MONTH_ROW_BUDGET;

  const row = (e, dim) => `<div class="sb-tourn ${selectedTournament === e.id ? 'active' : ''} ${dim ? 'dim' : ''}"
      data-name="${escAttr(e.labels.join(' ').toLowerCase())}"
      title="${escAttr(e.label)}${dim ? ' — no data in this period' : ''}"
      onclick="selectTournament('${jsStr(e.id)}')">${escHtml(e.label)}</div>`;

  let html = `<div class="sb-tourn ${selectedTournament ? '' : 'active'} ${canLoadAll ? '' : 'muted'}"
      data-name="all tournaments"
      title="${canLoadAll ? 'Every tournament this month' : 'Too much data to load at once — pick a tournament'}"
      onclick="${canLoadAll ? 'selectTournament(null)' : ''}">All tournaments</div>`;

  if (inMonth.length) {
    html += `<div class="sb-tourn-sect">${escHtml(periodLabel())}</div>`;
    for (const e of inMonth) html += row(e, false);
  }

  const seen = new Set(inMonth.map(e => e.id));
  const rest = all.filter(e => !seen.has(e.id));
  if (rest.length || scanning) {
    html += `<div class="sb-tourn-sect">Other periods${rest.length ? ` <span>${rest.length}</span>` : ''}</div>`;
    for (const e of rest) html += row(e, true);
    if (scanning) html += skeletonTournaments(4);
  } else if (!inMonth.length) {
    html += '<div class="sb-tourn-empty">No tournaments found</div>';
  }
  return html;
}

function renderNavTournaments(key) {
  const filterBox = navTournamentCount(key) > 14 ? navFilterHtml() : '';
  return `<div class="sb-tourn-wrap">${filterBox}
      <div class="sb-tourns" id="sb-tourns">${navTournamentRows(key)}</div>
    </div>`;
}

// Filter by hiding rows rather than re-rendering, so the input keeps focus.
function applyNavFilter() {
  const el = document.getElementById('sb-tourns');
  if (!el) return;
  const q = navFilter.trim().toLowerCase();
  let anyVisible = false;
  for (const row of el.querySelectorAll('.sb-tourn')) {
    const hit = !q || (row.dataset.name || '').includes(q);
    row.style.display = hit ? '' : 'none';
    if (hit) anyVisible = true;
  }
  // Section headings are noise once their rows are filtered away.
  for (const sect of el.querySelectorAll('.sb-tourn-sect')) {
    let next = sect.nextElementSibling, shows = false;
    while (next && !next.classList.contains('sb-tourn-sect')) {
      if (next.classList.contains('sb-tourn') && next.style.display !== 'none') { shows = true; break; }
      next = next.nextElementSibling;
    }
    sect.style.display = shows ? '' : 'none';
  }
  const empty = el.querySelector('.sb-tourn-nohit');
  if (q && !anyVisible) {
    if (!empty) el.insertAdjacentHTML('beforeend', '<div class="sb-tourn-empty sb-tourn-nohit">No match</div>');
  } else if (empty) {
    empty.remove();
  }
}

function renderSidebar() {
  const nav = document.getElementById('sb-nav');
  if (!nav) return;
  const cutoff = recentCutoff();

  let html = `<div class="sb-item ${activeSport ? '' : 'active'}" title="All sports" onclick="goHome()">
      <span class="sb-ico">${ICON.home}</span><span class="sb-txt">All sports</span>
    </div>
    <div class="sb-label">Sports</div>`;

  const keys = Object.keys(SPORTS).sort((a, b) => SPORTS[a].label.localeCompare(SPORTS[b].label));
  for (const key of keys) {
    const cfg = SPORTS[key];
    const isActive = key === activeSport;
    const open = isActive || navOpenGroups.has(key);
    const dr = sportData[key]?.dateRange;
    const fresh = dr && dr.max ? dr.max >= cutoff : null;
    const nTours = isActive ? (sportData[key]?.tournaments || []).length : 0;

    html += `<div class="sb-group ${open ? 'open' : ''} ${isActive ? 'has-active' : ''}">
        <div class="sb-group-head" title="${escAttr(cfg.label)}" onclick="switchSport('${key}')">
          <span class="sb-chev" onclick="toggleNavGroup('${key}', event)">${ICON.chevron}</span>
          ${sportIconHtml(key, 'sb-league-icon')}
          <span class="sb-group-name">${escHtml(cfg.label)}</span>
          ${nTours ? `<span class="sb-group-n">${nTours}</span>` : ''}
          ${fresh === null ? '' : `<span class="sb-dot ${fresh ? '' : 'off'}" title="${fresh ? 'Recent data' : 'No recent data'}"></span>`}
        </div>
        <div class="sb-group-body">${open ? (isActive ? renderNavTournaments(key) : '<div class="sb-tourns"><div class="sb-tourn-empty">Open this sport to list tournaments</div></div>') : ''}</div>
      </div>`;
  }
  nav.innerHTML = html;
}

function selectTournament(id) {

  toggleSidebar(false);
}
function switchSport(key) {
