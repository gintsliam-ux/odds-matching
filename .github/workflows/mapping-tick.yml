name: live-fixtures mapping-tick

# 24/7 backstop that refreshes the OpticOdds ↔ SwiftBet mappings even when the
# terminal isn't open. It just pings the app's /api/mapping-tick endpoint, which
# is server-throttled to rebuild at most once per 10 min — so this needs no
# secret and safely dedupes with the in-app pinger.
#
# GitHub's scheduled runs are best-effort and often a few minutes late, so we
# ask for every 5 min; combined with the 10-min server throttle that keeps
# mappings reliably <~15 min stale. Public repo → Actions minutes are free.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

# If a run is still going when the next fires, skip the new one rather than queue.
concurrency:
  group: mapping-tick
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      # --fail-with-body, not --fail: on a 500 we want the endpoint's JSON error
      # in the log. Plain --fail discards the body, which is why past failure
      # emails only ever said "error: 500".
      #
      # --retry rides out the transient Supabase/Mongo blips that used to fail a
      # run outright. Retrying is safe and cheap: the endpoint is server-throttled,
      # so a retry after a partial rebuild just returns `ran:false`, and the
      # matcher is idempotent — the next tick finishes the job. Only a genuinely
      # sustained outage (~all attempts over ~2 min) still fails and emails.
      - name: Trigger mapping refresh
        run: |
          echo "Pinging mapping-tick…"
          curl -sS --fail-with-body \
               --max-time 120 \
               --retry 2 --retry-delay 10 --retry-all-errors \
               https://live-fixtures.vercel.app/api/mapping-tick
          echo
