name: live-fixtures mapping-tick

# 24/7 backstop that refreshes the OpticOdds ↔ SwiftBet mappings even when the
# terminal isn't open. It just pings the app's /api/mapping-tick endpoint, which
# is server-throttled to rebuild at most once per 10 min — so this needs no
# secret and safely dedupes with the in-app pinger.
#
# GitHub's scheduled runs are best-effort. Asking for */5 did NOT buy 5-minute
# ticks: GitHub deprioritised this schedule down to a run every ~45 min and then
# started refusing to allocate a runner at all ("The job was not acquired by
# Runner of type hosted"), which is a queued-then-abandoned job — 15 min of
# waiting followed by a failure email, with the ping never sent. Asking every
# 15 min is honest about what we actually get, and the server throttles a
# rebuild to once per 10 min anyway, so */5 was only ever generating no-op
# pings and runner demand.
#
# This is a BACKSTOP. Whenever the terminal is open the in-app pinger keeps
# mappings ~10 min fresh on its own, so a skipped tick here is not an outage.
# Public repo → Actions minutes are free.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

# If a run is still going when the next fires, drop the OLD one. It used to hold
# the group open while stuck waiting for a runner, so a single unacquirable job
# blocked every later tick behind it. The ping is idempotent and the newest one
# is the only one worth running.
concurrency:
  group: mapping-tick
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    # Budget for 3 attempts at --max-time 200 plus the retry delays (~10.5 min).
    timeout-minutes: 12
    steps:
      # --fail-with-body, not --fail: on a 500 we want the endpoint's JSON error
      # in the log. Plain --fail discards the body, which is why past failure
      # emails only ever said "error: 500".
      #
      # --retry rides out the transient Supabase/Mongo blips that used to fail a
      # run outright. Retrying is safe and cheap: the endpoint is server-throttled,
      # so a retry after a partial rebuild just returns `ran:false`, and the
      # matcher is idempotent — the next tick finishes the job. Only a genuinely
      # sustained outage (~all attempts over ~2 min) still fails and emails.
      - name: Trigger mapping refresh
        run: |
          echo "Pinging mapping-tick…"
          # 200s, not 120: the tick now rebuilds BOTH books in one invocation
          # and was measured at 64s on prod (13s locally — the gap is cold start
          # plus Vercel→Atlas latency). A cold start on a big delta could have
          # blown a 120s budget and produced exactly the timeout emails this
          # workflow was fixed to stop sending.
          curl -sS --fail-with-body \
               --max-time 200 \
               --retry 2 --retry-delay 10 --retry-all-errors \
               https://live-fixtures.vercel.app/api/mapping-tick
          echo
